<!DOCTYPE html>
<!--
  Portal Colosseum - Arena Game Page
  ===================================
  This is the main game page. It displays the player's name,
  a canvas for the arena battle, and a logout button.

  Authentication Flow:
  1. Check for active Supabase session on load
  2. If no session, redirect back to login page
  3. If session exists, display player info from the session
  4. Canvas placeholder shows "Arena Battle Will Begin Soon"

  Session Storage:
  - No localStorage usage (all data in-memory or HttpOnly cookies)
  - Session tokens persisted via HttpOnly cookie + Edge Function
  - Player name derived from Supabase session, not stored locally
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Colosseum - Arena</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/public/game.css">
  <!-- Environment configuration - loaded before module scripts -->
  <script src="/api/env.js"></script>
</head>
<body class="game-page">
  <!-- Main game container -->
  <div id="game-container">
    <h1>PORTAL COLOSSEUM</h1>

    <!-- Player status bar: shows welcome message and logout button -->
    <div id="player-status">
      <span>Welcome, <span id="player-name">Gladiator</span></span>
      <button class="logout-btn" id="logout-btn">Logout</button>
    </div>

    <!-- Game canvas: 800x600 arena where battles will be rendered -->
    <canvas id="game" width="800" height="600"></canvas>
  </div>

  <!-- Application logic — external ES module (deferred, CSP-compliant) -->
  <!-- Replaces inline scripts that were blocked by CSP script-src without 'unsafe-inline' -->
  <script type="module" src="/game-app.js"></script>
</body>
</html>
