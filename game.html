<!DOCTYPE html>
<!--
  Portal Colosseum - Arena Game Page
  ===================================
  Main game page. Displays the town panorama background with a game canvas
  overlay for arena battles. The background shifts with arrow keys for a
  360° exploration feel.

  Authentication Flow:
  1. Check for active Supabase session on load
  2. If no session, redirect back to login page
  3. If session exists, initialize the game

  Session Storage:
  - Session stored in localStorage (PKCE flow) for cross-tab persistence
  - Refresh token stored in HttpOnly cookie via /api/session Edge Function
  - Player name derived from Supabase session, not stored locally
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Colosseum - Arena</title>
  <!-- Pixeloid Mono: pixel-perfect font for town UI markers -->
  <link href="https://fonts.googleapis.com/css2?family=Pixeloid+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/public/game.css">
  <!-- Environment configuration - loaded before module scripts -->
  <script src="/api/env.js"></script>
</head>
<body class="game-page">
  <!-- Main game container — fullscreen, pannable via CSS transform -->
  <div id="game-container">
    <!-- Panorama background layer — holds the town image + location markers -->
    <!-- Markers are inside .pano so they scroll with the background -->
    <div class="pano">
      <div id="town-locations" class="town-locations">
        <!-- Location markers positioned by game-app.js at building positions -->
        <!-- data-x = % across the 300vw panorama image -->
        <!-- data-y = % down from top of the image -->
        <div class="location-marker" data-location="portal" data-x="50" data-y="80">
          <span class="marker-text">Enter The Portal</span>
        </div>
        <div class="location-marker" data-location="store" data-x="40" data-y="65">
          <span class="marker-text">Store</span>
        </div>
        <div class="location-marker" data-location="wizard" data-x="68" data-y="65">
          <span class="marker-text">Wizard Hut</span>
        </div>
        <div class="location-marker" data-location="leaderboard" data-x="88" data-y="65">
          <span class="marker-text">Leaderboards</span>
        </div>
      </div>
    </div>
    <!-- Game canvas: renders the arena battle overlay -->
    <canvas id="game" width="800" height="600"></canvas>
  </div>

  <!-- Minimal logout button (bottom-right corner) -->
  <!-- TODO: replace with proper UI -->
  <div id="logout-corner">
    <button id="logout-btn" class="logout-corner-btn" title="Logout">×</button>
  </div>

  <!-- Application logic — external ES module (deferred, CSP-compliant) -->
  <!-- Replaces inline scripts that were blocked by CSP script-src without 'unsafe-inline' -->
  <script type="module" src="/game-app.js"></script>
</body>
</html>
