<!DOCTYPE html>
<!--
  Portal Colosseum - Arena Game Page
  ===================================
  Main game page. Displays the town panorama background with a game canvas
  overlay for arena battles. The background shifts with arrow keys for a
  360° exploration feel.

  Authentication Flow:
  1. Check for active Supabase session on load
  2. If no session, redirect back to login page
  3. If session exists, initialize the game

  Session Storage:
  - Session stored in localStorage (PKCE flow) for cross-tab persistence
  - Refresh token stored in HttpOnly cookie via /api/session Edge Function
  - Player name derived from Supabase session, not stored locally
-->
<html lang="en">
<head>
<!-- Phone redirect before paint. Same helper login uses; query string kept for PKCE. -->
<script src="/js/town-url.js"></script>
<script>
(function () {
  if (window.getTownUrl() === '/mobile') {
    // Preserve query string (PKCE callback params) when redirecting,
    // otherwise the auth code exchange is lost and the user loops back to login.
    window.location.replace('/mobile' + window.location.search);
  }
})();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Colosseum - Arena</title>
  <link rel="icon" href="/favicon.png" type="image/png" sizes="128x128">
  <!-- Pixeloid Mono: pixel-perfect font for town UI markers (self-hosted; not on Google Fonts) -->
  <!-- Pixeloid Mono (self-hosted, inlined to avoid Vercel static-file MIME issues) -->
  <style>@font-face{font-family:'Pixeloid Mono';src:url('/fonts/pixeloid-mono/pixeloid-mono-regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}</style>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/public/game.css">
  <!-- Environment configuration - loaded before module scripts -->
  <script src="/api/env.js"></script>
</head>
<body class="game-page">
  <!-- Main game container — fullscreen, pannable via CSS transform -->
  <div id="game-container">
    <!-- Panorama background layer — holds the town image + location markers -->
    <!-- Markers are inside .pano so they scroll with the background -->
    <div class="pano">
      <div id="town-locations" class="town-locations">
        <!-- Location markers positioned by game-app.js at building positions -->
        <!-- data-x = % across the 300vw panorama image -->
        <!-- data-y = % down from top of the image -->
        <!-- The campfire at the far left of the panorama is the Menu section -->
        <div class="location-marker" data-location="menu" data-x="6" data-y="80">
          <span class="marker-text">Menu</span>
        </div>
        <div class="location-marker" data-location="store" data-x="20" data-y="80">
          <span class="marker-text">Store</span>
        </div>
        <div class="location-marker" data-location="portal" data-x="50" data-y="80">
          <span class="marker-text">Enter The Portal</span>
        </div>
        <div class="location-marker" data-location="wizard" data-x="68" data-y="80">
          <span class="marker-text">Wizard Hut</span>
        </div>
        <div class="location-marker" data-location="leaderboard" data-x="88" data-y="80">
          <span class="marker-text">Leaderboards</span>
        </div>
      </div>
    </div>
    <!-- Game canvas: renders the arena battle overlay -->
    <canvas id="game" width="800" height="600"></canvas>
  </div>

  <!-- Minimal logout button (bottom-right corner) -->
  <!-- TODO: replace with proper UI -->
  <div id="logout-corner">
    <button id="logout-btn" class="logout-corner-btn" title="Logout">×</button>
  </div>

  <!-- Not yet ready modal -- default placeholder for unbuilt town locations -->
  <!-- Shows the DrunkJester image in a border with overlay text. Click or Esc dismisses. -->
  <div id="not-ready-modal" class="not-ready-modal" hidden>
    <div class="not-ready-frame">
      <button id="not-ready-close" class="not-ready-close" aria-label="Close">&times;</button>
      <img src="/public/pictures/ui/drunk-jester.jpg" alt="Feature not yet ready" class="not-ready-image">
      <div class="not-ready-text">this feature is not yet ready</div>
    </div>
  </div>

  <!-- Menu / Settings modal -- replaces the drunk jester for the Menu (campfire) location -->
  <div id="menu-settings-modal" class="not-ready-modal menu-settings-modal" hidden>
    <div class="not-ready-frame menu-settings-frame">
      <button id="menu-settings-close" class="not-ready-close" aria-label="Close">&times;</button>
      <div class="menu-settings-body">
        <div class="settings-header">MENU</div>

        <!-- Battle text speed -->
        <div class="settings-row">
          <div class="settings-label">Battle Text Speed</div>
          <div class="setting-options">
            <button class="speed-opt" data-speed="normal">Standard</button>
            <button class="speed-opt" data-speed="slow">Slow</button>
            <button class="speed-opt" data-speed="instant">Instant</button>
          </div>
        </div>

        <!-- Queue Font Size -->
        <div class="settings-row">
          <div class="settings-label">Queue Font Size</div>
          <div class="setting-options">
            <button class="speed-opt font-opt" data-font="S">S</button>
            <button class="speed-opt font-opt" data-font="M">M</button>
            <button class="speed-opt font-opt" data-font="L">L</button>
          </div>
        </div>

        <!-- Effect speed: one multiplier for every battle effect duration -->
        <div class="settings-row settings-row-stack">
          <div class="settings-label">Effect Speed</div>
          <div class="setting-options">
            <button class="speed-opt ux-opt" data-ux="0.5">0.5×</button>
            <button class="speed-opt ux-opt" data-ux="0.75">0.75×</button>
            <button class="speed-opt ux-opt" data-ux="1">1×</button>
            <button class="speed-opt ux-opt" data-ux="1.25">1.25×</button>
            <button class="speed-opt ux-opt" data-ux="1.5">1.5×</button>
          </div>
        </div>

        <!-- Screen shake + monster flash -->
        <div class="settings-row">
          <div class="settings-label">Screen Shake</div>
          <div class="setting-options">
            <button class="speed-opt shake-opt" data-shake="on">On</button>
            <button class="speed-opt shake-opt" data-shake="off">Off</button>
          </div>
        </div>

        <!-- Log out -->
        <div class="settings-divider"></div>
        <div class="settings-row logout-row">
          <div class="settings-label">Session</div>
          <button id="menu-logout-btn" class="settings-logout">Log Out</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Shop modal: vendor stall with vendor1.jpg backdrop, text cards, buy/sell/reroll/AP actions -->
  <div id="shop-modal" class="not-ready-modal shop-modal" hidden>
    <div class="not-ready-frame shop-frame">
      <button id="shop-close" class="not-ready-close" aria-label="Close">&times;</button>
      <div class="shop-backdrop" style="background-image: url('/public/pictures/ui/vendor1.jpg');"></div>
      <div class="shop-header" id="shop-header"></div>
      <div class="shop-stock-grid" id="shop-stock-grid"></div>
      <div class="shop-footer">Pixel shop • fixed stock • reroll costs gold • AP resets cost</div>
    </div>
  </div>

  <!-- Logout confirmation mini-dialog (inside settings modal) -->
  <div id="logout-confirm-dialog" class="logout-confirm-dialog" hidden>
    <div class="logout-confirm-body">
      <div class="logout-confirm-text">Leave the realm?</div>
      <div class="logout-confirm-actions">
        <button id="logout-confirm-yes">Yes</button>
        <button id="logout-confirm-no">No</button>
      </div>
    </div>
  </div>

  <!-- Shop styles (pixel aesthetic, matches not-ready-modal + run-equip cards) -->
  <style>
    .shop-modal .shop-frame { position: relative; display: flex; flex-direction: column; width: 96vw; max-width: 1400px; height: 90vh; background: #111; border: 6px double #ffcc66; outline: 3px solid #000; box-shadow: 0 0 40px rgba(255, 204, 102, 0.35); }
    .shop-backdrop { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0.25; z-index: 0; border-radius: 2px; }
    .shop-header { position: relative; z-index: 1; display: flex; gap: 16px; align-items: center; padding: 12px 16px; background: rgba(0,0,0,0.85); font-family: 'Pixeloid Mono', monospace; font-size: 14px; color: #ffcc66; }
    .shop-header button { font-family: 'Pixeloid Mono', monospace; background: #222; color: #ffcc66; border: 2px solid #ffcc66; padding: 2px 10px; cursor: pointer; }
    .shop-stock-grid { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; padding: 24px; margin-top: auto; max-height: 55vh; overflow: auto; }
    .shop-item-card { background: rgba(20,20,20,0.95); border: 2px solid #444; padding: 18px; font-family: 'Pixeloid Mono', monospace; color: #f8f8f0; }
    .shop-item-card.shop-focused, .shop-item-card:focus { border-color: #ffcc66; outline: 2px solid #ffcc66; box-shadow: 0 0 12px rgba(255, 204, 102, 0.5); }
    .shop-buy-btn.shop-focused, #shop-reroll-btn.shop-focused, #shop-apreset-btn.shop-focused, .shop-sell-btn.shop-focused { outline: 2px solid #ffcc66; }
    .shop-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .shop-item-name { font-weight: 700; font-size: 18px; }
    .shop-tier-badge { font-size: 16px; padding: 2px 10px; border: 2px solid; }
    .shop-stats { font-size: 15px; color: #aaa; margin: 6px 0; }
    .shop-item-price { color: #ffcc66; font-size: 17px; margin: 6px 0 12px; }
    .shop-qmult { font-size: 12px; color: #888; }
    .shop-buy-btn, .shop-sell-btn { width: 100%; font-family: 'Pixeloid Mono', monospace; background: #222; color: #0f0; border: 2px solid #0f0; padding: 8px; cursor: pointer; font-size: 15px; }
    .shop-sell-item-btn { width: 100%; font-family: 'Pixeloid Mono', monospace; background: #222; color: #ff7b7b; border: 2px solid #ff7b7b; padding: 8px; cursor: pointer; font-size: 15px; }
    .shop-sell-item-btn:hover { background: #ff7b7b; color: #000; }
    .shop-back-btn { font-family: 'Pixeloid Mono', monospace; background: #222; color: #7bc4ff; border: 2px solid #7bc4ff; padding: 8px; cursor: pointer; font-size: 15px; }
    .shop-back-btn:hover { background: #7bc4ff; color: #000; }
    .shop-buy-btn:hover { background: #0f0; color: #000; }
    .shop-sell-section { grid-column: 1 / -1; padding: 8px; background: #1a1a1a; border: 1px dashed #ffcc66; text-align: center; }
    .shop-sell-note { font-size: 10px; color: #666; margin-left: 8px; }
    .shop-footer { position: relative; z-index: 1; text-align: center; font-size: 10px; color: #555; padding: 6px; border-top: 1px solid #333; }
    .shop-error { color: #f66; padding: 20px; text-align: center; }
  </style>

  <!-- Application logic — external ES module (deferred, CSP-compliant) -->
  <!-- Replaces inline scripts that were blocked by CSP script-src without 'unsafe-inline' -->
  <script type="module" src="/js/shop-app.js"></script>
  <script type="module" src="/js/game-app.js"></script>

<div id="status-dock" class="status-dock" title="AP: +10/day · cap 30 · spent on runs &amp; shop rerolls&#10;Gold: earned from runs · spent at shops, entry fees &amp; rerolls">
  <div class="dock-left" id="hud-name">PLAYER</div>
  <div class="dock-center">
    AP
    <span class="ap-meter-small"><span class="ap-fill-small" id="hud-ap-fill"></span></span>
    <span id="hud-ap">24/30</span>
  </div>
  <div class="dock-right"><span id="hud-gold">◉ 0gc</span></div>
</div>
</body>
</html>
