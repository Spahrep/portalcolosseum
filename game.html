<!DOCTYPE html>
<!--
  Portal Colosseum - Arena Game Page
  ===================================
  This is the main game page. It displays the player's name,
  a canvas for the arena battle, and a logout button.

  Authentication Flow:
  1. Check for active Supabase session on load
  2. If no session, redirect back to login page
  3. If session exists, display player info from the session
  4. Canvas placeholder shows "Arena Battle Will Begin Soon"

  Session Storage:
  - playerName: stored in localStorage for display only (cosmetic cache)
  - No session tokens persisted to localStorage (XSS prevention)
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Colosseum - Arena</title>
  <link rel="stylesheet" href="/style.css">
  <!--
    Supabase JS Client
    Using ES Module import from esm.sh CDN - modern @supabase/supabase-js
    doesn't ship UMD builds, so we use the ES module version with import.
  -->
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.112.4';
    window.supabase = { createClient: createClient };
  </script>

  <!-- Environment configuration - loaded before application scripts -->
  <script src="/api/env.js"></script>

  <style>
    /*
      GAME PAGE STYLES
      ================
      Player status bar appears above the game canvas with a dark semi-transparent
      background. The logout button is styled in red to indicate its destructive action.
    */
    #player-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(30, 30, 50, 0.8);
      padding: 8px 16px;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .logout-btn {
      background: #3a1a1a;
      color: #f87171;
      border: 1px solid #5c2a2a;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .logout-btn:hover {
      background: #5c2a2a;
    }
  </style>
</head>
<body>
  <!-- Main game container -->
  <div id="game-container">
    <h1>PORTAL COLOSSEUM</h1>

    <!-- Player status bar: shows welcome message and logout button -->
    <div id="player-status">
      <span>Welcome, <span id="player-name">Gladiator</span></span>
      <button class="logout-btn" id="logout-btn">Logout</button>
    </div>

    <!-- Game canvas: 800x600 arena where battles will be rendered -->
    <canvas id="game" width="800" height="600"></canvas>
  </div>

  <script>
    /*
      GAME PAGE SCRIPTS
      =================
      Handles session verification, player info display, and the game canvas.
    */

    // === SUPABASE CONFIGURATION ===
    // Config is loaded from /api/env.js (served by Vercel serverless function)
    const SUPABASE_URL = window.ENV.SUPABASE_URL;
    const SUPABASE_ANON_KEY = window.ENV.SUPABASE_ANON_KEY;

    // Supabase client instance (initialized in initGame())
    let supabase;

    /**
     * Initialize the game page.
     * 1. Creates the Supabase client
     * 2. Checks for an active session (redirects to login if none)
     * 3. Displays the player's name
     * 4. Draws the placeholder canvas content
     */
    async function initGame() {
      // Initialize Supabase client with in-memory storage + PKCE flow
      // Security: tokens never persist to localStorage (XSS prevention)
      if (SUPABASE_URL) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: {
            flowType: 'pkce',
            detectSessionInUrl: true,
            storage: {
              getItem: () => null,
              setItem: () => {},
              removeItem: () => {}
            }
          }
        });
      }

      // --- Event listener bindings (no inline onclick handlers) ---
      document.getElementById('logout-btn')?.addEventListener('click', logout);

      // Fail-closed auth check: try in-memory session first, then cookie-based fallback
      // Security: We do NOT fall back to localStorage for auth decisions.
      // playerName in localStorage is purely cosmetic.
      let playerName = 'Guest';

      if (supabase) {
        try {
          // First: check for a PKCE callback (code in URL query params)
          if (window.location.search.includes('code=')) {
            // PKCE auto-exchange happened via detectSessionInUrl — just need to
            // pick up the session and persist the refresh token server-side
            const { data: { session }, error } = await supabase.auth.getSession();

            if (session && session.refresh_token) {
              // Persist the refresh token in an HttpOnly cookie via our Edge Function
              await fetch('/api/session', {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ refresh_token: session.refresh_token })
              });
            }
          } else {
            // No callback — try to recover session from the HttpOnly cookie
            const resp = await fetch('/api/session', {
              method: 'GET',
              credentials: 'include'
            });

            if (resp.ok) {
              const { session: cookieSession } = await resp.json();
              if (cookieSession) {
                // Restore the in-memory session from the cookie-obtained tokens
                await supabase.auth.setSession(cookieSession);
              }
            }
          }

          // Now check the session (whether from callback or cookie restore)
          const { data: { session }, error } = await supabase.auth.getSession();

          if (session) {
            // User is authenticated - extract display name from session
            const user = session.user;
            playerName = user.email ||
                        user.user_metadata?.full_name ||
                        user.user_metadata?.name ||
                        'Gladiator';
            // Security: Do NOT persist session to localStorage (XSS risk)
            localStorage.setItem('playerName', playerName);
          } else {
            // No active session - fail closed, redirect to login
            // Do NOT fall back to localStorage for access decisions
            window.location.href = '/login';
            return;
          }
        } catch (error) {
          // Fail closed on any error - redirect to login
          console.error('Session check failed:', error);
          window.location.href = '/login';
          return;
        }
      } else {
        // Supabase not initialized - fail closed, redirect to login
        window.location.href = '/login';
        return;
      }

      // Display the player's name on the status bar
      document.getElementById('player-name').textContent = playerName;

      // Initialize the game canvas with placeholder content
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      // Fill canvas with dark blue background
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw placeholder title text
      ctx.fillStyle = '#fff';
      ctx.font = '30px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('Arena Battle Will Begin Soon', canvas.width / 2, canvas.height / 2);

      // Draw player name subtitle
      ctx.font = '20px monospace';
      ctx.fillStyle = '#ff6b3b';
      ctx.fillText('Player: ' + playerName, canvas.width / 2, canvas.height / 2 + 50);
    }

    /**
     * Log out the current user.
     * Clears both the Supabase session and local storage,
     * then redirects back to the login page.
     */
    async function logout() {
      if (supabase) {
        try {
          await supabase.auth.signOut();
        } catch (error) {
          console.error('Logout error:', error);
        }
      }
      // Clear the HttpOnly session cookie via the Edge Function
      try {
        await fetch('/api/session', { method: 'DELETE', credentials: 'include' });
      } catch (err) {
        console.error('Cookie clear error:', err);
      }
      // Clear locally stored player name (cosmetic cache only)
      localStorage.removeItem('playerName');
      // Redirect to login page
      window.location.href = '/login';
    }

    // Initialize the game when the page loads
    window.onload = initGame;
  </script>
</body>
</html>
