<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Colosseum - Arena</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    #player-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(30,30,50,0.8);
      padding: 8px 16px;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .logout-btn {
      background: #3a1a1a;
      color: #f87171;
      border: 1px solid #5c2a2a;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .logout-btn:hover {
      background: #5c2a2a;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <h1>PORTAL COLOSSEUM</h1>

    <div id="player-status">
      <span>Welcome, <span id="player-name">Gladiator</span></span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <canvas id="game" width="800" height="600"></canvas>
  </div>

  <script>
    // === SUPABASE CONFIG ===
    const SUPABASE_URL = 'https://tfwwapxewlxiclufpcct.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_bQf1CYXUPQm-TC5hbo1RNA_FkwKzglK';

    let supabase;

    async function initGame() {
      if (SUPABASE_URL) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }

      // Try to get authenticated user
      let playerName = 'Guest';

      if (supabase) {
        const { data: { session } } = await supabase.auth.getSession();

        if (session) {
          const user = session.user;
          playerName = user.email || user.user_metadata?.full_name || user.user_metadata?.name || 'Gladiator';
          localStorage.setItem('playerName', playerName);
          localStorage.setItem('supabaseSession', JSON.stringify(session));
        } else {
          // Fallback to localStorage (for legacy or guest)
          playerName = localStorage.getItem('playerName') || 'Guest';
        }
      } else {
        playerName = localStorage.getItem('playerName') || 'Guest';
      }

      document.getElementById('player-name').textContent = playerName;

      // Initialize canvas
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#fff';
      ctx.font = '30px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('Arena Battle Will Begin Soon', canvas.width/2, canvas.height/2);

      ctx.font = '20px monospace';
      ctx.fillStyle = '#ff6b3b';
      ctx.fillText('Player: ' + playerName, canvas.width/2, canvas.height/2 + 50);
    }

    async function logout() {
      if (supabase) {
        await supabase.auth.signOut();
      }
      localStorage.removeItem('playerName');
      localStorage.removeItem('supabaseSession');
      window.location.href = '/login';
    }

    window.onload = initGame;
  </script>
</body>
</html>
