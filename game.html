<!DOCTYPE html>
<!--
  Portal Colosseum - Arena Game Page
  ===================================
  Main game page. Displays the town panorama background with a game canvas
  overlay for arena battles. The background shifts with arrow keys for a
  360° exploration feel.

  Authentication Flow:
  1. Check for active Supabase session on load
  2. If no session, redirect back to login page
  3. If session exists, initialize the game

  Session Storage:
  - Session stored in localStorage (PKCE flow) for cross-tab persistence
  - Refresh token stored in HttpOnly cookie via /api/session Edge Function
  - Player name derived from Supabase session, not stored locally
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Colosseum - Arena</title>
  <link rel="icon" href="/favicon.png" type="image/png" sizes="128x128">
  <!-- Pixeloid Mono: pixel-perfect font for town UI markers (self-hosted; not on Google Fonts) -->
  <link rel="stylesheet" href="/public/fonts/pixeloid-mono/pixeloid-mono.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/public/game.css">
  <!-- Environment configuration - loaded before module scripts -->
  <script src="/api/env.js"></script>
</head>
<body class="game-page">
  <!-- Main game container — fullscreen, pannable via CSS transform -->
  <div id="game-container">
    <!-- Panorama background layer — holds the town image + location markers -->
    <!-- Markers are inside .pano so they scroll with the background -->
    <div class="pano">
      <div id="town-locations" class="town-locations">
        <!-- Location markers positioned by game-app.js at building positions -->
        <!-- data-x = % across the 300vw panorama image -->
        <!-- data-y = % down from top of the image -->
        <!-- The campfire at the far left of the panorama is the Menu section -->
        <div class="location-marker" data-location="menu" data-x="6" data-y="80">
          <span class="marker-text">Menu</span>
        </div>
        <div class="location-marker" data-location="store" data-x="20" data-y="80">
          <span class="marker-text">Store</span>
        </div>
        <div class="location-marker" data-location="portal" data-x="50" data-y="80">
          <span class="marker-text">Enter The Portal</span>
        </div>
        <div class="location-marker" data-location="wizard" data-x="68" data-y="80">
          <span class="marker-text">Wizard Hut</span>
        </div>
        <div class="location-marker" data-location="leaderboard" data-x="88" data-y="80">
          <span class="marker-text">Leaderboards</span>
        </div>
      </div>
    </div>
    <!-- Game canvas: renders the arena battle overlay -->
    <canvas id="game" width="800" height="600"></canvas>
  </div>

  <!-- Minimal logout button (bottom-right corner) -->
  <!-- TODO: replace with proper UI -->
  <div id="logout-corner">
    <button id="logout-btn" class="logout-corner-btn" title="Logout">×</button>
  </div>

  <!-- Not yet ready modal -- default placeholder for unbuilt town locations -->
  <!-- Shows the DrunkJester image in a border with overlay text. Click or Esc dismisses. -->
  <div id="not-ready-modal" class="not-ready-modal" hidden>
    <div class="not-ready-frame">
      <button id="not-ready-close" class="not-ready-close" aria-label="Close">&times;</button>
      <img src="/public/pictures/ui/drunk-jester.jpg" alt="Feature not yet ready" class="not-ready-image">
      <div class="not-ready-text">this feature is not yet ready</div>
    </div>
  </div>

  <!-- Menu / Settings modal -- replaces the drunk jester for the Menu (campfire) location -->
  <div id="menu-settings-modal" class="not-ready-modal menu-settings-modal" hidden>
    <div class="not-ready-frame menu-settings-frame">
      <button id="menu-settings-close" class="not-ready-close" aria-label="Close">&times;</button>
      <div class="menu-settings-body">
        <div class="settings-header">MENU</div>

        <!-- Battle text speed -->
        <div class="settings-row">
          <div class="settings-label">Battle Text Speed</div>
          <div class="setting-options">
            <button class="speed-opt" data-speed="STANDARD">Standard</button>
            <button class="speed-opt" data-speed="SLOW">Slow</button>
            <button class="speed-opt" data-speed="INSTANT">Instant</button>
          </div>
        </div>

        <!-- Log out -->
        <div class="settings-divider"></div>
        <div class="settings-row logout-row">
          <div class="settings-label">Session</div>
          <button id="menu-logout-btn" class="settings-logout">Log Out</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Logout confirmation mini-dialog (inside settings modal) -->
  <div id="logout-confirm-dialog" class="logout-confirm-dialog" hidden>
    <div class="logout-confirm-body">
      <div class="logout-confirm-text">Leave the realm?</div>
      <div class="logout-confirm-actions">
        <button id="logout-confirm-yes">Yes</button>
        <button id="logout-confirm-no">No</button>
      </div>
    </div>
  </div>

  <!-- Application logic — external ES module (deferred, CSP-compliant) -->
  <!-- Replaces inline scripts that were blocked by CSP script-src without 'unsafe-inline' -->
  <script type="module" src="/js/game-app.js"></script>

<div id="status-dock" class="status-dock" title="AP: +10/day · cap 30 · spent on runs &amp; shop rerolls&#10;Gold: earned from runs · spent at shops, entry fees &amp; rerolls">
  <div class="dock-left" id="hud-name">PLAYER</div>
  <div class="dock-center">
    AP
    <span class="ap-meter-small"><span class="ap-fill-small"></span></span>
    24/30
  </div>
  <div class="dock-right">◉ 1,240gc</div>
</div>
</body>
</html>
