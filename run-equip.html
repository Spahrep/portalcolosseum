<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Colosseum • Run Equip</title>
  <link rel="stylesheet" href="/fonts/pixeloid-mono/pixeloid-mono.css">
  <script src="/api/env.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px 20px 70px;
      background: #000 url('/public/pictures/town/town_pano.jpg') center/cover no-repeat;
      font-family: 'Pixeloid Mono', 'Courier New', monospace;
      color: #e0e0ff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      image-rendering: pixelated;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      pointer-events: none;
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      /* Same frame and footprint as the DrunkJester "not yet ready" modal
       * (see .not-ready-frame / .not-ready-image in public/game.css). */
      box-sizing: border-box;
      width: min(85vw, 120vh);
      max-width: 100%;
      min-height: 78vh; /* same height as the DrunkJester modal image */
      display: flex;
      flex-direction: column;
      padding: 8px;
      background: #1a1a2e;
      border: 6px double #ffcc66;
      outline: 3px solid #000;
      box-shadow: 0 0 40px rgba(255, 204, 102, 0.35);
    }
    .top-bar {
      display: flex;
      border-bottom: 4px solid #4a90d9;
      background: rgba(10,26,46,0.78);
      flex-shrink: 0;
    }
    .run-info {
      flex: 1;
      padding: 10px 14px;
      border-right: 2px solid #334466;
    }
    .run-info h1 {
      margin: 0 0 2px;
      font-size: 16px;
      color: #66ccff;
      letter-spacing: 1px;
    }
    .run-info .subtitle {
      color: #4a90d9;
      font-size: 10px;
      margin-bottom: 4px;
    }
    .run-info .breadcrumb {
      color: #88aaff;
      font-size: 9px;
    }
    .dice-panel {
      width: 320px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.55);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .dice-header {
      color: #88aaff;
      font-size: 9px;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .dice-tray {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .die {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: #000;
      border: 1px solid #000;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35), inset 0 0 0 3px rgba(0,0,0,0.2);
      cursor: default;
    }
    .die.green  { background: #66ff99; }
    .die.yellow { background: #ffcc66; }
    .die.red    { background: #ff6666; }
    .dice-labels {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-left: 8px;
      font-size: 9px;
      color: #88aaff;
    }
    .main-area {
      display: flex;
      gap: 0;
      flex: 1 1 auto;
      min-height: 0;
    }
    .loadout-panel {
      width: 380px;
      padding: 14px;
      background: rgba(0,0,0,0.45);
      border-right: 2px solid #334466;
      display: flex;
      flex-direction: column;
    }
    .backpack-panel {
      flex: 1;
      padding: 14px;
      background: rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
    }
    .panel-title {
      color: #88aaff;
      font-size: 11px;
      letter-spacing: 1px;
      margin-bottom: 10px;
      padding-bottom: 4px;
      border-bottom: 1px solid #334466;
    }
    .slot-row {
      display: flex;
      align-items: stretch;
      margin-bottom: 8px;
      cursor: pointer;
      flex: 1;
    }
    .slot-label {
      width: 32px;
      font-size: 12px;
      color: #66ccff;
      font-weight: bold;
      align-self: center;
    }
    .slot-content {
      flex: 1;
      background: #0a1a2e;
      border: 2px solid #4a90d9;
      padding: 6px 10px;
      font-size: 12px;
      min-height: 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .slot-content.empty {
      color: #556677;
      font-style: italic;
    }
    .slot-content .stats {
      font-size: 9px;
      color: #a8c8ea;
      margin-top: 2px;
    }
    .backpack-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-auto-rows: 1fr;
      gap: 4px;
      flex: 1;
      min-height: 0;
    }
    .inv-slot {
      background: #0a1a2e;
      border: 2px solid #4a90d9;
      height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      padding: 2px;
    }
    .inv-slot.empty {
      color: #556677;
      font-size: 10px;
    }
    .inv-slot.selected {
      border-color: #66ff99;
      box-shadow: 0 0 0 2px #66ff99;
    }
    .bottom-bar {
      border-top: 4px solid #4a90d9;
      background: rgba(10,26,46,0.78);
      padding: 12px;
      text-align: center;
      flex-shrink: 0;
    }
    .enter-btn {
      background: #1a3a1a;
      color: #66ff99;
      border: 3px solid #66ff99;
      padding: 8px 32px;
      font-family: 'Pixeloid Mono', 'Courier New', monospace;
      font-size: 13px;
      cursor: pointer;
      letter-spacing: 1px;
    }
    .enter-btn:hover {
      background: #2a5a2a;
    }
    .cancel-btn {
      background: #2a2a3a;
      color: #aabbcc;
      border: 3px solid #667788;
      padding: 8px 20px;
      font-family: 'Pixeloid Mono', 'Courier New', monospace;
      font-size: 13px;
      cursor: pointer;
      letter-spacing: 1px;
      margin-left: 12px;
    }
    .cancel-btn:hover {
      background: #3a3a4a;
    }
    .note {
      margin-top: 8px;
      font-size: 9px;
      color: #7a8ca6;
    }
    .info-popup {
      position: absolute;
      background: #000;
      border: 2px solid #ccc;
      padding: 6px 10px;
      font-size: 10px;
      color: #fff;
      z-index: 200;
      line-height: 1.4;
      box-shadow: 0 0 0 1px #000;
      min-width: 180px;
      max-width: 200px;
      display: none;
      /* Info is display-only: never intercept clicks meant for whatever the
       * popup happens to cover, and never steal the hover of the item below. */
      pointer-events: none;
    }
    .info-popup .name {
      color: #ffcc66;
      font-size: 12px;
      margin-bottom: 2px;
    }
    .info-popup .type {
      color: #88aaff;
      font-size: 9px;
    }
    .info-popup .stat-line {
      color: #a8c8ea;
      font-size: 9px;
    }
    .info-popup .attacks {
      color: #ffcc66;
      font-size: 9px;
      margin-top: 4px;
    }
    .error-flash {
      color: #ff6666;
      font-size: 9px;
      animation: flash 0.6s;
    }
    @keyframes flash {
      0%,100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    .message-locked {
      background: #0a1a2e;
      border: 3px solid #ccc;
      padding: 12px 16px;
      font-size: 12px;
      color: #e0e0ff;
      text-align: center;
      margin: 0 auto;
      max-width: 420px;
    }
    .message-error {
      background: #2e0a0a;
      border: 2px solid #ff6666;
      padding: 10px 14px;
      font-size: 12px;
      color: #ff9999;
      text-align: center;
      margin: 10px auto 0 auto;
      max-width: 420px;
    }

    /* AP & Gold bottom dock (PC-52) — placeholder values, backend hookup later */
    .status-dock { position:fixed; bottom:0; left:0; right:0; height:30px; background:rgba(10,26,46,0.7); border-top:2px solid #4a90d9; display:flex; align-items:center; justify-content:space-between; padding:0 16px; font-size:11px; z-index:100; font-family:'Pixeloid Mono','Courier New',monospace; }
    .dock-left { color:#ffcc66; }
    .dock-center { color:#66ccff; display:flex; align-items:center; gap:6px; }
    .dock-right { color:#ffcc66; }
    .ap-meter-small { width:80px; height:3px; background:rgba(0,0,0,0.5); border:1px solid #334466; position:relative; display:inline-block; }
    .ap-fill-small { position:absolute; left:0; top:0; bottom:0; width:80%; background:#66ccff; }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="container">
    <!-- TOP BAR -->
    <div class="top-bar">
      <div class="run-info">
        <h1>PORTAL · RUN 1</h1>
        <div class="subtitle">EQUIPMENT SELECT</div>
        <div class="breadcrumb">PORTALS → EQUIP</div>
      </div>
      <div class="dice-panel">
        <div class="dice-header">
          <span>PORTAL DICE</span>
        </div>
        <div class="dice-tray">
          <div>
            <div style="display:flex;gap:3px;margin-bottom:2px;">
              <div class="die green" title="Normal Die">G</div>
              <div class="die green" title="Normal Die">G</div>
              <div class="die green" title="Normal Die">G</div>
              <div class="die green" title="Normal Die">G</div>
              <div class="die yellow" title="Crit Die">Y</div>
              <div class="die yellow" title="Crit Die">Y</div>
              <div class="die red" title="Fumble Die">R</div>
              <div class="die red" title="Fumble Die">R</div>
            </div>
            <div class="dice-labels">
              <div>REMAINING (8)</div>
              <div>USED (0)</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- MAIN AREA -->
    <div class="main-area">
      <!-- LOADOUT -->
      <div class="loadout-panel">
        <div class="panel-title">LOADOUT</div>
        <div class="slot-row" data-slot="0"><div class="slot-label">LH</div><div class="slot-content" id="slot-0"><span>—</span></div></div>
        <div class="slot-row" data-slot="1"><div class="slot-label">RH</div><div class="slot-content" id="slot-1"><span>—</span></div></div>
        <div class="slot-row" data-slot="2"><div class="slot-label">BL</div><div class="slot-content" id="slot-2"><span>—</span></div></div>
        <div class="slot-row" data-slot="3"><div class="slot-label">C1</div><div class="slot-content" id="slot-3"><span>—</span></div></div>
        <div class="slot-row" data-slot="4"><div class="slot-label">C2</div><div class="slot-content" id="slot-4"><span>—</span></div></div>
      </div>

      <!-- BACKPACK -->
      <div class="backpack-panel">
        <div class="panel-title">BACKPACK (20 SLOTS)</div>
        <div class="backpack-grid" id="backpack-grid"></div>
      </div>
    </div>

    <!-- BOTTOM -->
    <div class="bottom-bar" id="bottom-bar">
      <button class="enter-btn" id="enter-btn">ENTER PORTAL →</button>
      <button class="cancel-btn" id="cancel-btn">CANCEL</button>
      <div class="note">Loadout locks at entry — no inventory access between fights.</div>
    </div>

    <!-- Info popup lives INSIDE the container so position:absolute resolves
         against it; as a <body> child the left/top math landed it over the
         loadout slots (blocking the next click target). -->
    <div class="info-popup" id="info-popup"></div>
  </div>

  <script type="module" src="/js/run-equip-app.js"></script>

<div id="status-dock" class="status-dock" title="AP: +10/day · cap 30 · spent on runs &amp; shop rerolls&#10;Gold: earned from runs · spent at shops, entry fees &amp; rerolls">
  <div class="dock-left" id="hud-name">PLAYER</div>
  <div class="dock-center">
    AP
    <span class="ap-meter-small"><span class="ap-fill-small"></span></span>
    24/30
  </div>
  <div class="dock-right">◉ 1,240gc</div>
</div>
</body>
</html>
