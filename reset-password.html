<!DOCTYPE html>
<!--
  Portal Colosseum - Password Reset Page
  =====================================
  Allows users to set a new password after clicking a reset link sent by Supabase.
  The link contains a PKCE code in the URL query string (e.g. /reset-password?code=...).

  The external module reset-password-app.js handles:
  - Code exchange via Supabase PKCE flow
  - Password validation (8+ characters)
  - Calling supabase.auth.updateUser to set the new password

  Uses shared /public/auth.css for styling, maintaining the dark fantasy theme.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Colosseum - Reset Password</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/public/auth.css">
  <!-- Environment configuration - loaded before module scripts -->
  <script src="/api/env.js"></script>

  <style>
    /* Full-screen background image using CSS instead of an img tag */
    body {
      margin: 0;
      padding: 20px 0;
      min-height: 100vh;
      background-image: url('/public/logo.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: 'Courier New', monospace;
      overflow-x: hidden;
    }
  </style>
</head>
<body>
  <!-- Dark overlay behind the form -->
  <div class="auth-overlay"></div>

  <div id="login-page">
    <div class="auth-container">
      <h2>ARENA ACCESS</h2>

      <!-- Password reset form -->
      <div id="reset-form" style="display: none;">
        <div class="form-group">
          <input type="password" id="password" placeholder="New password" required minlength="8">
        </div>
        <div class="form-group">
          <input type="password" id="password-confirm" placeholder="Confirm new password" required minlength="8">
        </div>
        <button id="reset-btn" class="btn-primary">
          Reset Password
        </button>

        <!-- Link back to login page -->
        <p class="hint" style="text-align: center;">
          <a href="/login" class="text-orange">Back to login</a>
        </p>

        <!-- Password guidance link -->
        <p class="hint" style="text-align: center; font-size: 0.8em;">
          <a href="/passwords" class="text-orange">Password guidance</a>
        </p>
      </div>

      <!-- Auth message display area (success/error feedback) -->
      <div id="auth-message" class="auth-message" style="display: none;"></div>
    </div>
  </div>

  <!-- Application logic — external ES module (deferred, CSP-compliant) -->
  <script type="module" src="/reset-password-app.js"></script>
</body>
</html>
