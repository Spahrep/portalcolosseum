<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Colosseum • CLI Test Harness</title>
  <link rel="stylesheet" href="/public/fonts/pixeloid-mono/pixeloid-mono.css">
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #000;
      font-family: 'Pixeloid Mono', 'Courier New', monospace;
      color: #0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .cli-window {
      width: 960px;
      max-width: 100%;
      background: #000;
      border: 3px solid #ffaa00;
      box-shadow: 0 0 0 2px #000, inset 0 0 0 2px #331100;
      display: flex;
      flex-direction: column;
      height: 620px;
    }
    .cli-header {
      background: #0a0a0a;
      border-bottom: 3px solid #ffaa00;
      padding: 6px 12px;
      font-size: 12px;
      color: #ffaa00;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cli-output {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      background: #000;
      font-size: 13px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .cli-output .line { margin: 1px 0; }
    .cli-output .error { color: #ff6644; }
    .cli-output .amber { color: #ffaa00; }
    .cli-output .green { color: #0f0; }
    .cli-output .dim { color: #666; }
    .cli-input-line {
      border-top: 3px solid #ffaa00;
      padding: 8px 12px;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .prompt { color: #ffaa00; }
    .cli-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #0f0;
      font-family: inherit;
      font-size: 13px;
    }
    .status { font-size: 10px; color: #666; }
  </style>
</head>
<body>
  <div class="cli-window">
    <div class="cli-header">
      <div>PORTAL COLOSSEUM — LIVE COMBAT CLI HARNESS</div>
      <div class="status" id="auth-status">checking auth…</div>
    </div>
    <div class="cli-output" id="output"></div>
    <div class="cli-input-line">
      <span class="prompt">&gt;</span>
      <input type="text" class="cli-input" id="input" name="no-autofill" autocomplete="off" spellcheck="false" data-lpignore="true" data-form-type="other" placeholder="type help or state">
    </div>
  </div>
  <script src="/api/env.js"></script>
  <script type="module" src="/test/cli/cli-app.js"></script>
</body>
</html>
