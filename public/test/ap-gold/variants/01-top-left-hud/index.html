<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corner HUD — AP &amp; Gold Mockup</title>
  <link rel="stylesheet" href="/public/fonts/pixeloid-mono/pixeloid-mono.css">
  <style>
    :root { --navy: rgba(10,26,46,0.78); --border: #4a90d9; --gold: #ffcc66; --ap: #66ccff; }
    body { margin:0; padding:0; background:#000; color:#e0e0ff; font-family:'Pixeloid Mono','Courier New',monospace; overflow:hidden; image-rendering:pixelated; }
    .pano { position:absolute; inset:0; background-image:url('/public/pictures/town/town_pano.jpg'); background-repeat:repeat-x; background-size:auto 100vh; transition:transform 0.3s ease-out; }
    .location-marker { position:absolute; color:#f8f8f0; text-shadow:2px 2px 0 #000; font-size:clamp(14px,2.5vw,28px); cursor:pointer; white-space:nowrap; transition:transform 0.2s ease, color 0.2s; }
    .location-marker::before { content:'[ ]'; color:#ffcc66; margin-right:6px; }
    .location-marker.selected { color:#ffcc66; text-shadow:0 0 6px #ffcc66; transform:translateY(20px) scale(1.1); }
    .location-marker.selected::before { content:'[x]'; }
    .location-marker.visited { color:#88ccff; text-shadow:0 0 6px #88ccff; }
    .location-marker.visited::before { content:'[x]'; color:#88ccff; }
    .resource-cluster { position:fixed; top:16px; left:16px; z-index:100; background:var(--navy); border:2px solid var(--border); padding:8px; width:180px; font-size:11px; }
    .player { color:var(--gold); margin-bottom:4px; }
    .ap-row, .gold-row { display:flex; align-items:center; gap:6px; margin:3px 0; }
    .ap-label { color:#88aaff; }
    .ap-meter { flex:1; height:4px; background:rgba(0,0,0,0.5); border:1px solid #334466; position:relative; }
    .ap-fill { position:absolute; left:0; top:0; bottom:0; width:80%; background:var(--ap); }
    .ap-count { color:var(--ap); font-size:11px; }
    .gold { color:var(--gold); }
    .battle-container { display:none; width:960px; margin:40px auto; background:#0a1a2e; border:2px solid #4a90d9; }
    .top-bar { display:flex; justify-content:space-between; padding:8px 12px; background:rgba(10,26,46,0.9); border-bottom:1px solid #334466; }
    .run-info { flex:1; }
    .dice-panel { width:340px; }
    .dice-header { font-size:10px; color:#88aaff; margin-bottom:4px; }
    .dice-tray { display:flex; gap:4px; }
    .die { width:26px; height:26px; border:1px solid #000; display:flex; align-items:center; justify-content:center; font-size:10px; }
    .die.green { background:#66ff99; color:#000; }
    .die.yellow { background:#ffcc66; color:#000; }
    .die.red { background:#ff6666; color:#000; }
    .arena { padding:20px; }
    .monster { margin:12px 0; }
    .msg-box { background:rgba(0,0,0,0.4); padding:10px; margin:12px 0; font-size:12px; }
    .action-row { display:flex; gap:8px; }
    .btn { background:#334466; color:#e0e0ff; border:1px solid #4a90d9; padding:6px 14px; cursor:pointer; font-family:inherit; font-size:12px; }
    .btn:hover { background:#4a90d9; color:#000; }
    .mock-control { position:fixed; top:16px; right:16px; z-index:200; background:#1a2a4e; border:1px solid #4a90d9; padding:4px 10px; font-size:11px; cursor:pointer; }
    .logout { position:fixed; bottom:16px; right:16px; z-index:200; color:#ff6666; font-size:20px; cursor:pointer; }
    .battle-compact { font-size:10px; color:#88aaff; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div id="town-view">
    <div id="pano" class="pano"></div>
    <div id="resource-cluster" class="resource-cluster" title="AP: +10/day · cap 30 · spent on runs &amp; shop rerolls&#10;Gold: earned from runs · spent at shops, entry fees &amp; rerolls">
      <div class="player">SPAHREP</div>
      <div class="ap-row">
        <span class="ap-label">AP</span>
        <div class="ap-meter"><div class="ap-fill"></div></div>
        <span class="ap-count">24/30</span>
      </div>
      <div class="gold-row"><span class="gold">◉ 1,240gc</span></div>
    </div>
    <div id="logout" class="logout" title="logout (mockup)">×</div>
  </div>

  <div id="battle-view" class="hidden">
    <div class="battle-container">
      <div class="top-bar">
        <div class="run-info">
          <div>BATTLE 1 OF 5 — TIC 6</div>
          <div style="font-size:10px;color:#88aaff;">TOWN → ARENA</div>
        </div>
        <div class="battle-compact">AP 24/30 · 1,240gc</div>
      </div>
      <div class="dice-panel" style="padding:12px 16px;">
        <div class="dice-header">REMAINING (9) / USED (0)</div>
        <div class="dice-tray">
          <div class="die green">G</div><div class="die green">G</div><div class="die green">G</div><div class="die green">G</div>
          <div class="die yellow">Y</div><div class="die yellow">Y</div><div class="die yellow">Y</div>
          <div class="die red">R</div><div class="die red">R</div>
        </div>
      </div>
      <div class="arena">
        <div class="monster">Glimmerling  HP ▓▓▓▓▓▓▓░░ 82/100</div>
        <div class="msg-box">
          The Glimmerling shimmers.<br>
          You feel the weight of the portal behind you.<br>
          Ready?
        </div>
        <div class="action-row">
          <button class="btn">Quick Slash</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toggle-btn" class="mock-control">TOWN / BATTLE</div>

  <script src="app.js"></script>
</body>
</html>
