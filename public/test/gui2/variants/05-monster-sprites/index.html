<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Colosseum • Monster Sprites - Variant 05</title>
  <link rel="stylesheet" href="/fonts/pixeloid-mono/pixeloid-mono.css">
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #000;
      font-family: 'Pixeloid Mono', 'Courier New', monospace;
      color: #e0e0ff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      image-rendering: pixelated;
    }

    .frame {
      width: 900px;
      max-width: 100%;
      background: #000;
      border: 4px solid #4a90d9;
      box-shadow: 0 0 0 2px #000;
    }

    .header {
      background: #0a1a2e;
      border-bottom: 4px solid #4a90d9;
      padding: 8px 12px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 14px;
      color: #66ccff;
      letter-spacing: 1px;
    }

    .header .sub {
      margin: 2px 0 0;
      font-size: 9px;
      color: #888;
    }

    .panel-row {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #0a1a2e;
      justify-content: center;
    }

    .monster-panel {
      background: #000;
      border: 1px solid #ccc;
      width: 168px;
      padding: 8px 6px 6px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .sprite-container {
      position: relative;
      width: 100%;
      height: 110px;
      background: transparent;
      margin-bottom: 6px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .sprite-container svg {
      display: block;
    }

    .grass-strip {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 10px;
      background: #58c04a;
      border-top: 2px solid #3a8a32;
      z-index: 1;
    }

    .monster-name {
      color: #ffcc66;
      font-size: 10px;
      margin: 2px 0 1px;
      letter-spacing: 0.5px;
    }

    .monster-stats {
      color: #888;
      font-size: 8px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="header">
      <h1>PORTAL COLOSSEUM - MONSTER SPRITES - LOW-FI REFERENCE</h1>
      <div class="sub">5 templates - 100 HP base</div>
    </div>

    <div class="panel-row">
      <!-- 1. Glimmerling -->
      <div class="monster-panel">
        <div class="sprite-container">
          <svg width="82" height="78" viewBox="0 0 82 78" xmlns="http://www.w3.org/2000/svg">
            <rect x="12" y="18" width="58" height="48" rx="29" fill="#8a8a9a"/>
            <rect x="16" y="22" width="50" height="40" rx="25" fill="#6f6f7f"/>
            <circle cx="32" cy="38" r="5" fill="#1a1a22"/>
            <circle cx="52" cy="38" r="5" fill="#1a1a22"/>
            <rect x="28" y="48" width="26" height="4" fill="#1a1a22"/>
          </svg>
          <div class="grass-strip"></div>
        </div>
        <div class="monster-name">GLIMMERLING</div>
        <div class="monster-stats">DMG 5 - SPD 40 - HP 100</div>
      </div>

      <!-- 2. Blue Slime -->
      <div class="monster-panel">
        <div class="sprite-container">
          <svg width="82" height="78" viewBox="0 0 82 78" xmlns="http://www.w3.org/2000/svg">
            <rect x="12" y="18" width="58" height="48" rx="29" fill="#5a7adf"/>
            <rect x="16" y="22" width="50" height="40" rx="25" fill="#4a68c8"/>
            <circle cx="32" cy="38" r="5" fill="#1a1a22"/>
            <circle cx="52" cy="38" r="5" fill="#1a1a22"/>
            <rect x="28" y="48" width="26" height="4" fill="#1a1a22"/>
          </svg>
          <div class="grass-strip"></div>
        </div>
        <div class="monster-name">BLUE SLIME</div>
        <div class="monster-stats">DMG 10 - SPD 30 - HP 100</div>
      </div>

      <!-- 3. Giant Rat -->
      <div class="monster-panel">
        <div class="sprite-container">
          <svg width="86" height="72" viewBox="0 0 86 72" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="24" width="66" height="32" rx="8" fill="#6b5a4a"/>
            <rect x="18" y="18" width="22" height="18" rx="4" fill="#5a4a3a"/>
            <circle cx="26" cy="26" r="3" fill="#1a1a22"/>
            <circle cx="38" cy="26" r="3" fill="#1a1a22"/>
            <rect x="72" y="28" width="12" height="8" fill="#5a4a3a"/>
            <rect x="4" y="32" width="10" height="6" fill="#5a4a3a"/>
          </svg>
          <div class="grass-strip"></div>
        </div>
        <div class="monster-name">GIANT RAT</div>
        <div class="monster-stats">DMG 6 - SPD 25 - HP 100</div>
      </div>

      <!-- 4. Wolf -->
      <div class="monster-panel">
        <div class="sprite-container">
          <svg width="100" height="80" viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
            <!-- body (leaner than rat) -->
            <rect x="24" y="28" width="52" height="24" rx="10" fill="#9aa0a8"/>
            <rect x="30" y="32" width="40" height="16" rx="8" fill="#7a8088"/>
            <!-- chest highlight (bright front) -->
            <rect x="26" y="36" width="12" height="12" rx="5" fill="#b0b6be"/>
            <!-- head (raised, joins neck) -->
            <rect x="8" y="16" width="26" height="20" rx="6" fill="#9aa0a8"/>
            <rect x="12" y="20" width="18" height="12" rx="4" fill="#7a8088"/>
            <!-- ears (short nubs on head top) -->
            <rect x="10" y="10" width="7" height="6" rx="2" fill="#9aa0a8"/>
            <rect x="22" y="10" width="7" height="6" rx="2" fill="#9aa0a8"/>
            <rect x="12" y="11" width="3" height="3" fill="#1a1a22"/>
            <rect x="24" y="11" width="3" height="3" fill="#1a1a22"/>
            <!-- muzzle (bright, protrudes past face, dark nose) -->
            <rect x="0" y="24" width="14" height="8" rx="3" fill="#b0b6be"/>
            <rect x="1" y="24" width="4" height="4" rx="1" fill="#1a1a22"/>
            <!-- eyes -->
            <circle cx="14" cy="26" r="3" fill="#1a1a22"/>
            <circle cx="24" cy="26" r="3" fill="#1a1a22"/>
            <!-- tail: hook curled forward over the back, solidly on the body -->
            <rect x="74" y="20" width="7" height="16" rx="2" fill="#7a8088"/>
            <rect x="70" y="14" width="8" height="5" rx="2" fill="#7a8088"/>
            <rect x="70" y="14" width="3" height="3" fill="#1a1a22"/>
          </svg>
          <div class="grass-strip"></div>
        </div>
        <div class="monster-name">WOLF</div>
        <div class="monster-stats">DMG 12 - SPD 20 - HP 100</div>
      </div>

      <!-- 5. Imp -->
      <div class="monster-panel">
        <div class="sprite-container">
          <svg width="70" height="90" viewBox="0 0 70 90" xmlns="http://www.w3.org/2000/svg">
            <!-- body -->
            <rect x="18" y="42" width="34" height="28" rx="8" fill="#c85050"/>
            <rect x="22" y="46" width="26" height="20" rx="6" fill="#a83838"/>
            <!-- head -->
            <rect x="20" y="18" width="30" height="26" rx="13" fill="#c85050"/>
            <rect x="24" y="22" width="22" height="18" rx="9" fill="#a83838"/>
            <!-- ears -->
            <rect x="16" y="14" width="8" height="10" rx="2" fill="#c85050"/>
            <rect x="46" y="14" width="8" height="10" rx="2" fill="#c85050"/>
            <!-- tiny horns -->
            <rect x="19" y="10" width="4" height="6" rx="1" fill="#1a1a22"/>
            <rect x="47" y="10" width="4" height="6" rx="1" fill="#1a1a22"/>
            <!-- eyes -->
            <circle cx="28" cy="28" r="3" fill="#1a1a22"/>
            <circle cx="40" cy="28" r="3" fill="#1a1a22"/>
            <!-- tail -->
            <rect x="50" y="52" width="14" height="6" rx="3" fill="#a83838"/>
          </svg>
          <div class="grass-strip"></div>
        </div>
        <div class="monster-name">IMP</div>
        <div class="monster-stats">DMG 9 - SPD 30 - HP 100</div>
      </div>
    </div>
  </div>
</body>
</html>
