<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/api/env.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portal Colosseum • Mobile Town</title>
  <style>
    @font-face {
      font-family: 'Pixeloid Mono';
      src: url('/fonts/pixeloid-mono/pixeloid-mono-regular.ttf') format('truetype');
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pixeloid Mono', 'Courier New', monospace;
      background: #0a0a1a;
      color: #e0e0ff;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
    }

    /* Status bar at top */
    .status-bar {
      background: rgba(10, 26, 46, 0.97);
      border-bottom: 2px solid #ffcc66;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      flex-shrink: 0;
      gap: 8px;
    }
    .status-bar .name {
      color: #88aaff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .status-bar .ap {
      color: #66ccff;
      white-space: nowrap;
    }
    .status-bar .gold {
      color: #ffcc66;
      white-space: nowrap;
    }

    /* Main nav list — fills remaining space */
    .nav-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 8px;
      overflow-y: auto;
    }

    /* Portal button — giant, primary */
    .nav-btn.portal {
      flex: 2.5;
      min-height: 120px;
      background: linear-gradient(180deg, #1a2a4a 0%, #0f1a30 100%);
      border: 3px solid #66aaff;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.1s;
      position: relative;
      overflow: hidden;
    }
    .nav-btn.portal::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 30%, rgba(102, 170, 255, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .nav-btn.portal:active {
      transform: scale(0.97);
      border-color: #aaccff;
      background: linear-gradient(180deg, #1f3560 0%, #152545 100%);
    }
    .nav-btn.portal .icon {
      font-size: 28px;
      margin-bottom: 4px;
      filter: drop-shadow(0 0 6px rgba(102, 170, 255, 0.4));
    }
    .nav-btn.portal .label {
      font-size: 18px;
      color: #aaccff;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .nav-btn.portal .sub {
      font-size: 10px;
      color: #6688aa;
      margin-top: 2px;
    }

    /* Regular town buttons */
    .nav-btn.town-option {
      flex: 1;
      min-height: 52px;
      background: rgba(15, 22, 40, 0.9);
      border: 2px solid #334466;
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      cursor: pointer;
      transition: all 0.1s;
      gap: 12px;
    }
    .nav-btn.town-option:active {
      transform: scale(0.97);
      border-color: #6688bb;
      background: rgba(25, 35, 60, 0.95);
    }
    .nav-btn.town-option .icon {
      font-size: 18px;
      width: 28px;
      text-align: center;
      flex-shrink: 0;
    }
    .nav-btn.town-option .label {
      font-size: 14px;
      color: #ccd;
      letter-spacing: 1px;
    }
    .nav-btn.town-option .arrow {
      margin-left: auto;
      color: #445577;
      font-size: 14px;
    }

    /* Logout pill tucked at bottom */
    .logout-pill {
      flex-shrink: 0;
      text-align: center;
      padding: 8px 0 10px;
    }
    .logout-pill button {
      font-family: inherit;
      font-size: 10px;
      color: #554;
      background: transparent;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 4px 16px;
      cursor: pointer;
    }
    .logout-pill button:active {
      color: #887766;
      border-color: #665544;
    }

    /* Landscape tweak */
    @media (min-width: 600px) {
      .nav-list {
        padding: 16px 20%;
      }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      .nav-btn.portal {
        min-height: 80px;
      }
      .nav-btn.town-option {
        min-height: 40px;
      }
    }
  </style>
</head>
<body>
  <!-- Status bar -->
  <div class="status-bar">
    <span id="hud-name" class="name">PLAYER</span>
    <span id="hud-ap" class="ap">AP --/--</span>
    <span id="hud-gold" class="gold">◉ --gc</span>
  </div>

  <!-- Navigation list -->
  <div id="nav-list" class="nav-list">
    <!-- Portal — the big button -->
    <div id="btn-portal" class="nav-btn portal">
      <div class="icon">◈</div>
      <div class="label">Enter The Portal</div>
      <div class="sub">Start a run · costs AP + Gold</div>
    </div>

    <!-- Town options -->
    <div id="btn-store" class="nav-btn town-option">
      <span class="icon">⚔️</span>
      <span class="label">Store</span>
      <span class="arrow">›</span>
    </div>
    <div id="btn-wizard" class="nav-btn town-option">
      <span class="icon">🔮</span>
      <span class="label">Wizard Hut</span>
      <span class="arrow">›</span>
    </div>
    <div id="btn-leaderboard" class="nav-btn town-option">
      <span class="icon">🏆</span>
      <span class="label">Leaderboards</span>
      <span class="arrow">›</span>
    </div>
    <div id="btn-menu" class="nav-btn town-option">
      <span class="icon">⚙</span>
      <span class="label">Menu</span>
      <span class="arrow">›</span>
    </div>
  </div>

  <!-- Logout -->
  <div class="logout-pill">
    <button id="btn-logout">Leave the realm</button>
  </div>

  <!-- Not yet ready modal -- default placeholder for unbuilt town locations -->
  <div id="not-ready-modal" class="not-ready-modal" hidden>
    <div class="not-ready-frame">
      <button id="not-ready-close" class="not-ready-close" aria-label="Close">&times;</button>
      <img src="/public/pictures/ui/drunk-jester.jpg" alt="Feature not yet ready" class="not-ready-image">
      <div class="not-ready-text">this feature is not yet ready</div>
    </div>
  </div>

  <!-- Menu / Settings modal -->
  <div id="menu-settings-modal" class="not-ready-modal menu-settings-modal" hidden>
    <div class="not-ready-frame menu-settings-frame">
      <button id="menu-settings-close" class="not-ready-close" aria-label="Close">&times;</button>
      <div class="menu-settings-body">
        <div class="settings-header">MENU</div>

        <!-- Battle text speed -->
        <div class="settings-row">
          <div class="settings-label">Battle Text Speed</div>
          <div class="setting-options">
            <button class="speed-opt" data-speed="normal">Standard</button>
            <button class="speed-opt" data-speed="slow">Slow</button>
            <button class="speed-opt" data-speed="instant">Instant</button>
          </div>
        </div>

        <!-- Queue Font Size -->
        <div class="settings-row">
          <div class="settings-label">Queue Font Size</div>
          <div class="setting-options">
            <button class="speed-opt font-opt" data-font="S">S</button>
            <button class="speed-opt font-opt" data-font="M">M</button>
            <button class="speed-opt font-opt" data-font="L">L</button>
          </div>
        </div>

        <!-- Log out -->
        <div class="settings-divider"></div>
        <div class="settings-row logout-row">
          <div class="settings-label">Session</div>
          <button id="menu-logout-btn" class="settings-logout">Log Out</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Logout confirmation mini-dialog (inside settings modal) -->
  <div id="logout-confirm-dialog" class="logout-confirm-dialog" hidden>
    <div class="logout-confirm-body">
      <div class="logout-confirm-text">Leave the realm?</div>
      <div class="logout-confirm-actions">
        <button id="logout-confirm-yes">Yes</button>
        <button id="logout-confirm-no">No</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/mobile-app.js"></script>
</body>
</html>
