<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/api/env.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portal Colosseum • Mobile Town</title>
  <style>
    @font-face {
      font-family: 'Pixeloid Mono';
      src: url('/fonts/pixeloid-mono/pixeloid-mono-regular.ttf') format('truetype');
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pixeloid Mono', 'Courier New', monospace;
      background: #0a0a1a;
      color: #e0e0ff;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
    }

    /* Status bar at top */
    .status-bar {
      background: rgba(10, 26, 46, 0.97);
      border-bottom: 2px solid #ffcc66;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      flex-shrink: 0;
      gap: 8px;
    }
    .status-bar .name {
      color: #88aaff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .status-bar .ap {
      color: #66ccff;
      white-space: nowrap;
    }
    .status-bar .gold {
      color: #ffcc66;
      white-space: nowrap;
    }

    /* Main nav list — fills remaining space */
    .nav-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 8px;
      overflow-y: auto;
    }

    /* Portal button — giant, primary */
    .nav-btn.portal {
      flex: 2.5;
      min-height: 120px;
      background: linear-gradient(180deg, #1a2a4a 0%, #0f1a30 100%);
      border: 3px solid #66aaff;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.1s;
      position: relative;
      overflow: hidden;
    }
    .nav-btn.portal::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 30%, rgba(102, 170, 255, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .nav-btn.portal:active {
      transform: scale(0.97);
      border-color: #aaccff;
      background: linear-gradient(180deg, #1f3560 0%, #152545 100%);
    }
    .nav-btn.portal .icon {
      font-size: 28px;
      margin-bottom: 4px;
      filter: drop-shadow(0 0 6px rgba(102, 170, 255, 0.4));
    }
    .nav-btn.portal .label {
      font-size: 18px;
      color: #aaccff;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .nav-btn.portal .sub {
      font-size: 10px;
      color: #6688aa;
      margin-top: 2px;
    }

    /* Regular town buttons */
    .nav-btn.town-option {
      flex: 1;
      min-height: 52px;
      background: rgba(15, 22, 40, 0.9);
      border: 2px solid #334466;
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      cursor: pointer;
      transition: all 0.1s;
      gap: 12px;
    }
    .nav-btn.town-option:active {
      transform: scale(0.97);
      border-color: #6688bb;
      background: rgba(25, 35, 60, 0.95);
    }
    .nav-btn.town-option .icon {
      font-size: 18px;
      width: 28px;
      text-align: center;
      flex-shrink: 0;
    }
    .nav-btn.town-option .label {
      font-size: 14px;
      color: #ccd;
      letter-spacing: 1px;
    }
    .nav-btn.town-option .arrow {
      margin-left: auto;
      color: #445577;
      font-size: 14px;
    }

    /* Logout pill tucked at bottom */
    .logout-pill {
      flex-shrink: 0;
      text-align: center;
      padding: 8px 0 10px;
    }
    .logout-pill button {
      font-family: inherit;
      font-size: 10px;
      color: #554;
      background: transparent;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 4px 16px;
      cursor: pointer;
    }
    .logout-pill button:active {
      color: #887766;
      border-color: #665544;
    }

    /* Landscape tweak */
    @media (min-width: 600px) {
      .nav-list {
        padding: 16px 20%;
      }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      .nav-btn.portal {
        min-height: 80px;
      }
      .nav-btn.town-option {
        min-height: 40px;
      }
    }

    /* "Not yet ready" modal — DrunkJester image in a bordered frame,
       overlay text. Click anywhere or tap X to dismiss. */
    .not-ready-modal {
      position: fixed;
      inset: 0;
      z-index: 9998;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .not-ready-modal[hidden] {
      display: none;
    }
    .not-ready-frame {
      position: relative;
      padding: 8px;
      background: #1a1a2e;
      border: 6px double #ffcc66;
      outline: 3px solid #000;
      box-shadow: 0 0 40px rgba(255, 204, 102, 0.35);
      max-width: 94vw;
    }
    .not-ready-close {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid #ffcc66;
      background: #1a1a2e;
      color: #ffcc66;
      font-family: 'Pixeloid Mono', 'Courier New', monospace;
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }
    .not-ready-close:active {
      background: #ffcc66;
      color: #1a1a2e;
    }
    .not-ready-image {
      display: block;
      max-width: min(88vw, 110vh);
      max-height: 74vh;
      width: auto;
      height: auto;
    }
    .not-ready-text {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Pixeloid Mono', 'Courier New', monospace;
      font-size: clamp(14px, 4.2vw, 24px);
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      background: rgba(0, 0, 0, 0.78);
      border: 2px solid #ffcc66;
      padding: 8px 14px;
      white-space: nowrap;
      text-shadow:
        2px 0 0 #000,
        -2px 0 0 #000,
        0 2px 0 #000,
        0 -2px 0 #000;
      pointer-events: none;
    }

    /* Menu / Settings modal */
    .menu-settings-modal {
      cursor: default;
    }
    .menu-settings-frame {
      min-width: 0;
      max-width: min(92vw, 420px);
      padding: 0;
      overflow: visible;
    }
    .menu-settings-body {
      padding: 20px 18px 16px;
    }
    .settings-header {
      text-align: center;
      font-family: 'Pixeloid Mono', 'Courier New', monospace;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #ffcc66;
      margin-bottom: 18px;
      text-shadow: 0 0 12px rgba(255, 204, 102, 0.5);
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .settings-label {
      font-family: 'Pixeloid Mono', 'Courier New', monospace;
      font-size: 13px;
      color: #88aaff;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .setting-options {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .speed-opt {
      background: #0a1a2e;
      color: #88aaff;
      border: 2px solid #334466;
      font-family: 'Pixeloid Mono', 'Courier New', monospace;
      font-size: 12px;
      padding: 6px 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: 0.5px;
    }
    .speed-opt:active {
      background: #1a3a5e;
      border-color: #66ccff;
      color: #ccddff;
    }
    .speed-opt.active {
      background: #1a3a1a;
      border-color: #66ff99;
      color: #66ff99;
      box-shadow: 0 0 6px rgba(102, 255, 153, 0.3);
    }
    .settings-divider {
      height: 1px;
      background: #334466;
      margin: 14px 0;
    }
    .logout-row {
      margin-bottom: 0;
    }
    .settings-logout {
      background: #2a0a0a;
      color: #ff6666;
      border: 2px solid #5c1a1a;
      font-family: 'Pixeloid Mono', 'Courier New', monospace;
      font-size: 13px;
      padding: 6px 18px;
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: 1px;
    }
    .settings-logout:active {
      background: #4a1a1a;
      border-color: #ff6666;
      color: #ff8888;
    }

    /* Logout confirmation mini-dialog (inside settings modal) */
    .logout-confirm-dialog {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .logout-confirm-dialog[hidden] {
      display: none;
    }
    .logout-confirm-body {
      background: #1a1a2e;
      border: 2px solid #ff6666;
      padding: 18px 24px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 102, 102, 0.25);
      max-width: 88vw;
    }
    .logout-confirm-text {
      font-family: 'Pixeloid Mono', 'Courier New', monospace;
      font-size: 14px;
      color: #ffcc66;
      margin-bottom: 14px;
      letter-spacing: 1px;
    }
    .logout-confirm-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .logout-confirm-actions button {
      font-family: 'Pixeloid Mono', 'Courier New', monospace;
      font-size: 13px;
      padding: 6px 20px;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.15s ease;
    }
    #logout-confirm-yes {
      background: #3a0a0a;
      color: #ff6666;
      border: 2px solid #5c1a1a;
    }
    #logout-confirm-no {
      background: #0a1a2e;
      color: #88aaff;
      border: 2px solid #334466;
    }
  </style>
</head>
<body>
  <!-- Status bar -->
  <div class="status-bar">
    <span id="hud-name" class="name">PLAYER</span>
    <span id="hud-ap" class="ap">AP --/--</span>
    <span id="hud-gold" class="gold">◉ --gc</span>
  </div>

  <!-- Navigation list -->
  <div id="nav-list" class="nav-list">
    <!-- Portal — the big button -->
    <div id="btn-portal" class="nav-btn portal">
      <div class="icon">◈</div>
      <div class="label">Enter The Portal</div>
      <div class="sub">Start a run · costs AP + Gold</div>
    </div>

    <!-- Town options -->
    <div id="btn-store" class="nav-btn town-option">
      <span class="icon">⚔️</span>
      <span class="label">Store</span>
      <span class="arrow">›</span>
    </div>
    <div id="btn-wizard" class="nav-btn town-option">
      <span class="icon">🔮</span>
      <span class="label">Wizard Hut</span>
      <span class="arrow">›</span>
    </div>
    <div id="btn-leaderboard" class="nav-btn town-option">
      <span class="icon">🏆</span>
      <span class="label">Leaderboards</span>
      <span class="arrow">›</span>
    </div>
    <div id="btn-menu" class="nav-btn town-option">
      <span class="icon">⚙</span>
      <span class="label">Menu</span>
      <span class="arrow">›</span>
    </div>
  </div>

  <!-- Logout -->
  <div class="logout-pill">
    <button id="btn-logout">Leave the realm</button>
  </div>

  <!-- Not yet ready modal -- default placeholder for unbuilt town locations -->
  <div id="not-ready-modal" class="not-ready-modal" hidden>
    <div class="not-ready-frame">
      <button id="not-ready-close" class="not-ready-close" aria-label="Close">&times;</button>
      <img src="/public/pictures/ui/drunk-jester.jpg" alt="Feature not yet ready" class="not-ready-image">
      <div class="not-ready-text">this feature is not yet ready</div>
    </div>
  </div>

  <!-- Menu / Settings modal -->
  <div id="menu-settings-modal" class="not-ready-modal menu-settings-modal" hidden>
    <div class="not-ready-frame menu-settings-frame">
      <button id="menu-settings-close" class="not-ready-close" aria-label="Close">&times;</button>
      <div class="menu-settings-body">
        <div class="settings-header">MENU</div>

        <!-- Battle text speed -->
        <div class="settings-row">
          <div class="settings-label">Battle Text Speed</div>
          <div class="setting-options">
            <button class="speed-opt" data-speed="normal">Standard</button>
            <button class="speed-opt" data-speed="slow">Slow</button>
            <button class="speed-opt" data-speed="instant">Instant</button>
          </div>
        </div>

        <!-- Queue Font Size -->
        <div class="settings-row">
          <div class="settings-label">Queue Font Size</div>
          <div class="setting-options">
            <button class="speed-opt font-opt" data-font="S">S</button>
            <button class="speed-opt font-opt" data-font="M">M</button>
            <button class="speed-opt font-opt" data-font="L">L</button>
          </div>
        </div>

        <!-- Log out -->
        <div class="settings-divider"></div>
        <div class="settings-row logout-row">
          <div class="settings-label">Session</div>
          <button id="menu-logout-btn" class="settings-logout">Log Out</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Logout confirmation mini-dialog (inside settings modal) -->
  <div id="logout-confirm-dialog" class="logout-confirm-dialog" hidden>
    <div class="logout-confirm-body">
      <div class="logout-confirm-text">Leave the realm?</div>
      <div class="logout-confirm-actions">
        <button id="logout-confirm-yes">Yes</button>
        <button id="logout-confirm-no">No</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/mobile-app.js"></script>
</body>
</html>
