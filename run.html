<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Colosseum • Run Battle</title>
  <link rel="stylesheet" href="/fonts/pixeloid-mono/pixeloid-mono.css">
  <script src="/api/env.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px 20px 70px;
      background: #000 url('/public/pictures/town/town_pano.jpg') center/cover no-repeat;
      font-family: 'Pixeloid Mono', 'Courier New', monospace;
      color: #e0e0ff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      image-rendering: pixelated;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      pointer-events: none;
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      width: 960px;
      max-width: 100%;
      background: rgba(0,0,0,0.30);
      border: 4px solid #4a90d9;
      box-shadow: 0 0 0 2px #000;
    }
    .top-bar {
      display: flex;
      border-bottom: 4px solid #4a90d9;
      background: rgba(10,26,46,0.78);
    }
    .run-info {
      flex: 1;
      padding: 10px 14px;
      border-right: 2px solid #334466;
    }
    .run-info h1 {
      margin: 0 0 2px;
      font-size: 20px;
      color: #66ccff;
      letter-spacing: 1px;
    }
    .run-info .subtitle {
      color: #4a90d9;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .run-info .breadcrumb {
      color: #88aaff;
      font-size: 12px;
    }
    .dice-panel {
      width: 340px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.55);
    }
    .dice-header {
      color: #88aaff;
      font-size: 12px;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .dice-tray {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .die {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
      color: #000;
      border: 1px solid #000;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35), inset 0 0 0 3px rgba(0,0,0,0.2);
      cursor: default;
    }
    .die.green  { background: #66ff99; }
    .die.yellow { background: #ffcc66; }
    .die.red    { background: #ff6666; }
    .die.highlight {
      box-shadow: 0 0 0 3px #ffffff, inset 0 0 0 2px rgba(255,255,255,0.35), inset 0 0 0 3px rgba(0,0,0,0.2);
      transform: scale(1.08);
      z-index: 2;
    }
    .die.rolled {
      animation: die-roll-pop 0.25s ease-out;
    }
    @keyframes die-roll-pop {
      0%   { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    /* PC-70: the die face number spins in on every roll tick — each tick is
       a fresh span, so the reel animation replays even when the value is
       unchanged (duplicate faces are legitimate dice design). */
    .die.rolling .die-face {
      display: block;
      animation: die-face-roll 0.22s ease-out;
    }
    @keyframes die-face-roll {
      0%   { transform: perspective(48px) rotateX(90deg); }
      100% { transform: perspective(48px) rotateX(0deg); }
    }
    /* PC-70: hit feedback — impact impulse, not rumble. Monster→player hits
       jolt the run-window contents (the .container; the page background and
       status dock stay put). Player→monster hits recoil that monster's card
       and white-flash its sprite box (hit-confirmed signal — white, not red:
       red belongs to the HP-band severity language). Class names are the
       contract with js/battle-app.js (HIT_FEEDBACK + trigger functions). */
    @keyframes window-shake {
      0%   { transform: translate(0, 0); }
      15%  { transform: translate(-4px, 2px); }
      30%  { transform: translate(4px, -2px); }
      45%  { transform: translate(-3px, 1px); }
      60%  { transform: translate(3px, -1px); }
      75%  { transform: translate(-2px, 1px); }
      90%  { transform: translate(1px, 0); }
      100% { transform: translate(0, 0); }
    }
    .container-shake { animation: window-shake 0.28s linear; }
    @keyframes monster-card-shake {
      0%   { transform: translate(0, 0); }
      20%  { transform: translate(-3px, 0); }
      40%  { transform: translate(3px, 0); }
      60%  { transform: translate(-2px, 0); }
      80%  { transform: translate(2px, 0); }
      100% { transform: translate(0, 0); }
    }
    .monster-hit { animation: monster-card-shake 0.22s linear; }
    @keyframes sprite-hit-flash {
      0%   { background: #ffffff; filter: brightness(3); }
      100% { background: #112233; filter: brightness(1); }
    }
    .sprite-flash { animation: sprite-hit-flash 0.18s ease-out; }
    /* PC-74: crit juice escalation (harder shake/flash). Separate classes keep non-crit behavior unchanged.
       Stronger amplitude + longer duration. Class restart pattern in battle-app.js still applies. */
    @keyframes window-crit-shake {
      0%   { transform: translate(0, 0); }
      12%  { transform: translate(-8px, 4px); }
      24%  { transform: translate(7px, -5px); }
      36%  { transform: translate(-6px, 3px); }
      48%  { transform: translate(5px, -3px); }
      60%  { transform: translate(-4px, 2px); }
      72%  { transform: translate(3px, -2px); }
      84%  { transform: translate(-2px, 1px); }
      100% { transform: translate(0, 0); }
    }
    .container-crit-shake { animation: window-crit-shake 0.42s linear; }
    @keyframes monster-crit-shake {
      0%   { transform: translate(0, 0); }
      15%  { transform: translate(-6px, 0); }
      30%  { transform: translate(6px, 0); }
      45%  { transform: translate(-5px, 0); }
      60%  { transform: translate(4px, 0); }
      75%  { transform: translate(-3px, 0); }
      90%  { transform: translate(2px, 0); }
      100% { transform: translate(0, 0); }
    }
    .monster-crit-hit { animation: monster-crit-shake 0.28s linear; }
    @keyframes sprite-crit-flash {
      0%   { background: #ffffff; filter: brightness(4); }
      100% { background: #112233; filter: brightness(1); }
    }
    .sprite-crit-flash { animation: sprite-crit-flash 0.28s ease-out; }
    /* monster-card.crit is the hook for future unique crit sprite swap (see setMonsterSprite stub) */
    .monster-card.crit .monster-sprite { outline: 2px solid #ffcc00; outline-offset: 2px; }
    /* PC-71: monster death — the card flashes red (three pulses) then fades
       out in place. Keyframes override the card's inline background/border
       while the animation runs; `forwards` keeps the faded end state until
       battle-app.js removes the element (animationend + timeout fallback).
       Duration must match MONSTER_DEATH_MS in js/battle-app.js. */
    @keyframes monster-death {
      0%   { background-color: rgba(0, 0, 0, 0.4); border-color: #4a90d9; opacity: 1; }
      14%  { background-color: #dd2222; border-color: #ff6666; }
      28%  { background-color: rgba(0, 0, 0, 0.4); border-color: #4a90d9; }
      42%  { background-color: #ee2222; border-color: #ff6666; }
      56%  { background-color: rgba(0, 0, 0, 0.4); border-color: #4a90d9; }
      70%  { background-color: #ff2222; border-color: #ff8888; }
      82%  { background-color: #991111; border-color: #cc4444; opacity: 1; }
      100% { background-color: #550000; border-color: #881111; opacity: 0; }
    }
    .monster-dying {
      animation: monster-death 1.2s ease-in forwards;
      pointer-events: none;
    }
    .dice-labels {
      font-size: 12px;
      color: #88aaff;
      line-height: 1.3;
    }
    .current-die {
      margin-left: 12px;
      display: none;
      flex-direction: column;
      align-items: center;
    }
    .main-area {
      display: flex;
      gap: 0;
    }
    .player-panel {
      width: 220px;
      padding: 14px;
      background: rgba(0,0,0,0.45);
      border-right: 2px solid #334466;
    }
    .monsters-panel {
      flex: 1;
      padding: 14px;
      background: rgba(0,0,0,0.45);
      min-height: 220px;
    }
    .queue-panel {
      width: 220px;
      padding: 14px;
      background: rgba(0,0,0,0.45);
      border-left: 2px solid #334466;
    }
    /* Ceremony-intro: while the battle-start dice ceremony plays, the command window
       stays hidden until the timing track has finished filling in (battle-app.js
       removes the class via the queue fill's onDone). */
    body.intro-pending .action-menu,
    body.intro-pending .footer-info {
      display: none;
    }
    /* PC-DEC-045: while the typewriter/action-queue animations are playing,
       hide the LH/RH command input — `command-hidden` is toggled by the
       typewriter in battle-app.js alongside setBusy. */
    body.command-hidden .action-menu {
      display: none;
    }
    /* Timing track stays hidden until the monsters are in; released by
       finishBattleIntro() when the fill starts (rows then fade in one at a time). */
    body.queue-filling .queue-panel {
      display: none;
    }
    .queue-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 13px;
      padding: 2px 14px 2px 6px;
      margin-bottom: 2px;
      border: 1px solid #2a3a55;
      border-radius: 2px;
      color: #aaccff;
      position: relative;
      overflow: hidden;
    }
    .queue-row .name { color: #ccddff; }
    .queue-row .tic { color: #6688aa; font-size: 12px; }
    /* PC-56 Queue Font Size + top-row + prediction bar/pin + animations (added inside existing <style>) */
    .queue-size-S .queue-row { font-size: 13px!important; }
    .queue-size-S .queue-row .tic { font-size: 12px!important; }
    .queue-size-S .queue-row.top-row { font-size: 15px!important; }

    .queue-size-M .queue-row { font-size: 15px!important; }
    .queue-size-M .queue-row .tic { font-size: 13px!important; }
    .queue-size-M .queue-row.top-row { font-size: 17px!important; }

    .queue-size-L .queue-row { font-size: 17px!important; }

    /* PC-72 dramatic combat timing keyframes */
    @keyframes queue-row-enter {
      0% { opacity: 0; transform: translateX(20px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    .queue-row-enter { animation: queue-row-enter 250ms ease-out; }

    @keyframes queue-row-exit {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-20px); }
    }
    .queue-row-exit { animation: queue-row-exit 200ms ease-in forwards; }
    .queue-size-L .queue-row .tic { font-size: 14px!important; }
    .queue-size-L .queue-row.top-row { font-size: 19px!important; }

    /* ---- Top 3 rows ---- */
    .queue-row.top-row {
      color: #ffeedd;
      font-weight: bold;
      background: rgba(255,255,255,0.04);
    }

    /* ---- Prediction bar (continuous yellow strip) ---- */
    #queue { position: relative; padding-right: 10px; }
    .prediction-bar {
      position: absolute;
      right: 0;
      width: 8px;
      background: #ffcc66;
      border-radius: 2px;
      opacity: 0.7;
      pointer-events: none;
      z-index: 2;
    }

    /* ---- Queue bar for insert animation (yellow sweep on player rows) ---- */
    .queue-bar {
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      width: 8px;
      background: #ffcc66;
      border-radius: 2px;
      opacity: 0;
      pointer-events: none;
      z-index: 3;
    }

    /* ---- Current action being narrated — golden glow highlight ---- */
    .queue-row-current {
      box-shadow: inset 0 0 10px rgba(255, 204, 102, 0.4), 0 0 6px rgba(255, 204, 102, 0.2);
      background: rgba(255, 204, 102, 0.08);
    }

    /* ---- Resolve animation (flash then shrink) ---- */
    @keyframes queue-flash {
      0%   { background: transparent; }
      30%  { background: rgba(255, 204, 102, 0.3); }
      100% { background: transparent; }
    }
    .queue-row-flash {
      animation: queue-flash 0.3s ease-out;
    }
    .queue-row-shrink {
      transition: transform 0.3s ease-in, opacity 0.3s ease-in;
      transform: scaleY(0);
      opacity: 0;
      max-height: 0;
      overflow: hidden;
    }

    /* ---- Bar entry animation (5-step flow: push, grow left-to-right, flash, disappear) ---- */
    @keyframes queue-bar-entry {
      0% {
        width: 8px;
        opacity: 0;
      }
      5% {
        opacity: 0.7;
      }
      50% {
        width: 100%;
        opacity: 0.7;
      }
      65% {
        width: 100%;
        opacity: 1.0;
      }
      80% {
        width: 100%;
        opacity: 0.7;
      }
      100% {
        opacity: 0;
        width: 100%;
      }
    }
    .queue-row-enter .queue-bar {
      animation: queue-bar-entry 1.2s ease-out forwards;
    }
    .queue-row-enter {
      /* base enter for row visibility if needed */
      animation: none;
    }

    /* Monster pulse (no bar) */
    @keyframes queue-monster-pulse {
      0%   { background: transparent; box-shadow: none; }
      30%  { background: rgba(200, 50, 50, 0.15); box-shadow: inset 0 0 6px rgba(200, 50, 50, 0.3); }
      100% { background: transparent; box-shadow: none; }
    }
    .queue-row-monster-enter {
      animation: queue-monster-pulse 0.4s ease-out;
    }
    @keyframes queue-arrive-glow {
      0%   { box-shadow: 0 0 0 0 rgba(255, 204, 102, 0.6); }
      50%  { box-shadow: 0 0 0 6px rgba(255, 204, 102, 0.2); }
      100% { box-shadow: 0 0 0 0 rgba(255, 204, 102, 0); }
    }
    .queue-arrived {
      animation: queue-arrive-glow 0.35s ease-out;
    }

    /* PC-63 DW cascading command menu — three-window modal cascade per the
       locked spec (docs/battle-status-ui.md Cascading Window Spec;
       shared/CommandSelection.png). Orange frames/text, blue hand tab, green
       hand cursor. PC-DEC-027: palette provisional (PMVP window options). */
    .dw-root {
      position: relative;
      flex: 1;
      min-height: 236px;
      overflow: visible;
    }
    .dw-window {
      position: absolute;
      top: 0;
      left: 0;
      width: 316px; /* border-box: total frame = 316px (content 290px — same as before) */
      box-sizing: border-box;
      background: #000;
      border: 4px solid #ff8c1a;
      box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.55);
      padding: 10px 8px 8px;
      font-size: 13px;
      line-height: 1.5;
      color: #ff9a3c;
    }
    .dw-tab {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: #000;
      border: 2px solid #3a3a8c;
      color: #8a8aff;
      padding: 1px 14px;
      font-size: 13px;
      letter-spacing: 1px;
      white-space: nowrap;
      z-index: 2;
    }
    .dw-text {
      margin-bottom: 8px;
      color: #ff9a3c;
      white-space: nowrap;
    }
    .dw-row {
      position: relative;
      padding: 1px 2px 1px 16px;
      cursor: pointer;
      white-space: nowrap;
    }
    .dw-row.active::before {
      content: '\261e';
      position: absolute;
      left: 0;
      top: 0;
      color: #33cc66;
      text-shadow: 0 0 1px #fff, 0 0 1px #fff;
    }
    .dw-row:hover { background: rgba(255, 140, 26, 0.12); }
    .dw-row.disabled { color: #556677; cursor: default; }
    .dw-row.disabled:hover { background: transparent; }
    .dw-gap { height: 8px; }
    .dw-letter { color: #ff9a3c; font-weight: bold; }
    .dw-weapon { color: #8a8aff; }
    .dw-dim { color: #556677; }
    .st-green { color: #33cc66; }
    .st-amber { color: #ffcc66; }
    .st-orange { color: #ff9a3c; }
    .st-red { color: #ff4444; }
    .panel-title {
      color: #88aaff;
      font-size: 14px;
      letter-spacing: 1px;
      margin-bottom: 10px;
      padding-bottom: 4px;
      border-bottom: 1px solid #334466;
    }
    .stat-block {
      background: #000;
      border: 1px solid #ccc;
      padding: 4px 8px;
      font-size: 14px;
      margin-bottom: 8px;
      position: relative;
      overflow: hidden;
    }
    .stat-block .hp-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: #ff3333;
      width: 100%;
      z-index: 0;
    }
    .stat-block #hp-value {
      position: relative;
      z-index: 1;
    }
    .loadout-mini {
      font-size: 13px;
      color: #a8c8ea;
      margin-top: 8px;
    }
    .message-box {
      background: #0a1a2e;
      border: 3px solid #4a90d9;
      padding: 12px 14px;
      font-size: 14px;
      color: #e0e0ff;
      height: 140px;
      overflow-y: auto;
      line-height: 1.45;
    }
    .msg-line { margin-bottom: 3px; }
    .msg-error {
      background: #2e0a0a;
      border: 2px solid #ff6666;
      padding: 10px 14px;
      font-size: 14px;
      color: #ff9999;
      margin: 4px 0;
    }
    .action-menu {
      position: relative;
      display: flex;
      gap: 8px;
      padding: 12px;
      background: rgba(10,26,46,0.78);
      border-top: 2px solid #334466;
    }
    .action-btn {
      flex: 1;
      background: #1a3a1a;
      color: #66ff99;
      border: 3px solid #66ff99;
      padding: 10px 0;
      font-family: 'Pixeloid Mono', 'Courier New', monospace;
      font-size: 15px;
      cursor: pointer;
      letter-spacing: 1px;
    }
    .action-btn:hover {
      background: #2a5a2a;
    }
    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .action-choices {
      flex: 1;
      min-width: 0;
      position: relative;
    }
    .action-readout {
      position: absolute;
      top: 0;
      width: 340px;
      background: rgba(0,0,0,0.5);
      border: 2px solid #334466;
      border-radius: 2px;
      padding: 8px 10px;
      font-size: 12px;
      color: #aaccff;
      line-height: 1.45;
      min-height: 22px;
      display: flex;
      align-items: center;
    }
    .action-readout strong { color: #ffcc66; }
    .action-readout:empty::before {
      content: 'Select a command to see details';
      color: #556677;
    }
    .action-choices .action-btn {
      flex: 1;
    }
    .hand-label {
      color: #ffcc66;
    }
    .action-dmg {
      color: #88aaff;
    }
    /* gui1-style per-hand command lists (scoped to action area) */
    .command-box {
      flex: 1;
      background: #0a1a2e;
      padding: 8px 10px;
      border-right: 2px solid #334466;
      min-width: 0;
    }
    .command-box:last-child {
      border-right: none;
    }
    .hand-header {
      color: #ffaa66;
      font-size: 13px;
      margin-bottom: 2px;
      letter-spacing: 0.5px;
    }
    .weapon-name {
      color: #88ccff;
      font-size: 13px;
      margin-bottom: 6px;
      padding-bottom: 3px;
      border-bottom: 1px solid #334466;
    }
    .command-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 14px;
    }
    .command {
      padding: 2px 6px;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .command:hover {
      background: #1a3a6e;
      color: #ffcc66;
    }
    .command.selected {
      color: #ffcc66;
      background: #1a3a6e;
    }
    .slot-btn {
      flex: 0 0 110px;
      width: 110px;
      background: #1a3a1a;
      color: #66ff99;
      border: 3px solid #66ff99;
      padding: 10px 0;
      font-family: 'Pixeloid Mono', 'Courier New', monospace;
      font-size: 14px;
      cursor: pointer;
      letter-spacing: 1px;
      text-align: center;
    }
    .slot-btn:hover:not(:disabled) {
      background: #2a5a2a;
    }
    .slot-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      color: #668866;
      border-color: #446644;
    }
    /* CONFIRM — commit the selected attack; amber to stand out from slots */
    .confirm-btn {
      flex: 0 0 140px;
      width: 140px;
      color: #ffcc66;
      border-color: #ffcc66;
      background: #3a2a1a;
    }
    .confirm-btn:hover:not(:disabled) {
      background: #5a3a1a;
    }
    .confirm-btn:disabled {
      color: #886666;
      border-color: #664444;
    }
    .action-status {
      flex: 1;
      text-align: center;
      color: #ffcc66;
      font-size: 13px;
      padding: 10px 0;
      letter-spacing: 1px;
      align-self: center;
    }
    .bottom-bar {
      border-top: 4px solid #4a90d9;
      background: rgba(10,26,46,0.78);
      padding: 10px;
      text-align: center;
      font-size: 12px;
      color: #7a8ca6;
    }
    .monster-card {
      display: inline-block;
      width: 140px;
      margin: 4px;
      vertical-align: top;
    }

    /* AP & Gold bottom dock (PC-52) — placeholder values, backend hookup later */
    .status-dock { position:fixed; bottom:0; left:0; right:0; height:30px; background:rgba(10,26,46,0.7); border-top:2px solid #4a90d9; display:flex; align-items:center; justify-content:space-between; padding:0 16px; font-size:13px; z-index:100; font-family:'Pixeloid Mono','Courier New',monospace; }
    .dock-left { color:#ffcc66; }
    .dock-center { color:#66ccff; display:flex; align-items:center; gap:6px; }
    .dock-right { color:#ffcc66; }
    .ap-meter-small { width:80px; height:3px; background:rgba(0,0,0,0.5); border:1px solid #334466; position:relative; display:inline-block; }
    .ap-fill-small { position:absolute; left:0; top:0; bottom:0; width:80%; background:#66ccff; }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="container">
    <!-- TOP BAR -->
    <div class="top-bar">
      <div class="run-info">
        <h1 id="run-title">PORTAL · RUN —</h1>
        <div class="subtitle" id="battle-label">BATTLE — OF —</div>
        <div class="breadcrumb">PORTALS → BATTLE</div>
      </div>
      <div class="end-run-wrap" style="margin-left:auto; display:flex; align-items:center;">
        <button id="end-run-btn" class="action-btn" style="font-size:13px; padding:6px 10px;">End Run</button>
      </div>
      <div class="dice-panel">
        <div class="dice-header">
          <span>PORTAL DICE</span>
        </div>
        <div class="dice-tray">
          <div>
            <div id="dice-tray"></div>
            <div id="dice-labels" class="dice-labels"></div>
          </div>
          <div id="current-die" class="current-die"></div>
        </div>
      </div>
    </div>

    <!-- MAIN AREA -->
    <div class="main-area">
      <!-- PLAYER -->
      <div class="player-panel">
        <div class="panel-title">PLAYER</div>
        <div class="stat-block" id="player-hp"><div class="hp-bar-fill" id="hp-bar-fill"></div><span style="color:#fff;" id="hp-value">HP: —</span></div>
        <div class="loadout-mini">
          LH: <span id="loadout-lh">—</span><br>
          RH: <span id="loadout-rh">—</span>
        </div>
      </div>

      <!-- MONSTERS -->
      <div class="monsters-panel">
        <div class="panel-title">MONSTERS</div>
        <div id="monsters"></div>
      </div>

      <!-- ACTION QUEUE (next-up events, per design mockups) -->
      <div class="queue-panel">
        <div class="panel-title">Action Queue</div>
        <div id="queue"></div>
      </div>
    </div>

    <!-- MESSAGE BOX -->
    <div style="padding:0 14px 8px 14px;">
      <div class="panel-title" style="margin:0 0 6px;">MESSAGE LOG
      </div>
      <div id="message-box" class="message-box"></div>
    </div>

    <!-- ACTION MENU -->
    <div class="action-menu">
      <div id="action-choices" class="action-choices"></div>
      <div id="action-readout" class="action-readout"></div>
    </div>
    </div>
    <!-- BOTTOM -->
  </div>

  <script type="module" src="/js/battle-app.js"></script>

<div id="status-dock" class="status-dock" title="AP: +10/day · cap 30 · spent on runs &amp; shop rerolls&#10;Gold: earned from runs · spent at shops, entry fees &amp; rerolls">
  <div class="dock-left" id="hud-name">PLAYER</div>
  <div class="dock-center">
    AP
    <span class="ap-meter-small"><span class="ap-fill-small"></span></span>
    24/30
  </div>
  <div class="dock-right">◉ 1,240gc</div>
</div>
