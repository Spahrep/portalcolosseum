<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Colosseum • Run Battle</title>
  <link rel="stylesheet" href="/fonts/pixeloid-mono/pixeloid-mono.css">
  <script src="/api/env.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px 20px 70px;
      background: #000 url('/public/pictures/town/town_pano.jpg') center/cover no-repeat;
      font-family: 'Pixeloid Mono', 'Courier New', monospace;
      color: #e0e0ff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      image-rendering: pixelated;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      pointer-events: none;
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      width: 960px;
      max-width: 100%;
      background: rgba(0,0,0,0.30);
      border: 4px solid #4a90d9;
      box-shadow: 0 0 0 2px #000;
    }
    .top-bar {
      display: flex;
      border-bottom: 4px solid #4a90d9;
      background: rgba(10,26,46,0.78);
    }
    .run-info {
      flex: 1;
      padding: 10px 14px;
      border-right: 2px solid #334466;
    }
    .run-info h1 {
      margin: 0 0 2px;
      font-size: 16px;
      color: #66ccff;
      letter-spacing: 1px;
    }
    .run-info .subtitle {
      color: #4a90d9;
      font-size: 10px;
      margin-bottom: 4px;
    }
    .run-info .breadcrumb {
      color: #88aaff;
      font-size: 9px;
    }
    .dice-panel {
      width: 340px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.55);
    }
    .dice-header {
      color: #88aaff;
      font-size: 9px;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .dice-tray {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .die {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: #000;
      border: 1px solid #000;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35), inset 0 0 0 3px rgba(0,0,0,0.2);
      cursor: default;
    }
    .die.green  { background: #66ff99; }
    .die.yellow { background: #ffcc66; }
    .die.red    { background: #ff6666; }
    .die.highlight {
      box-shadow: 0 0 0 3px #ffffff, inset 0 0 0 2px rgba(255,255,255,0.35), inset 0 0 0 3px rgba(0,0,0,0.2);
      transform: scale(1.08);
      z-index: 2;
    }
    .die.rolled {
      animation: die-roll-pop 0.25s ease-out;
    }
    @keyframes die-roll-pop {
      0%   { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    /* PC-70: every roll tick flashes the die, so a repeated face value
       (dice can carry the same value on several faces) still reads as
       actively rolling instead of stuck. Fires once per tick via the
       reflow-restart trick in rollDiceAnimation(). */
    .die.rolling {
      animation: die-roll-flash 0.18s ease-out;
    }
    @keyframes die-roll-flash {
      0%   { box-shadow: 0 0 16px 6px rgba(255,255,255,0.95), inset 0 0 0 2px rgba(255,255,255,0.35), inset 0 0 0 3px rgba(0,0,0,0.2); transform: scale(1.12); }
      100% { box-shadow: 0 0 0 0 rgba(255,255,255,0), inset 0 0 0 2px rgba(255,255,255,0.35), inset 0 0 0 3px rgba(0,0,0,0.2); transform: scale(1); }
    }
    .dice-labels {
      font-size: 9px;
      color: #88aaff;
      line-height: 1.3;
    }
    .current-die {
      margin-left: 12px;
      display: none;
      flex-direction: column;
      align-items: center;
    }
    .main-area {
      display: flex;
      gap: 0;
    }
    .player-panel {
      width: 220px;
      padding: 14px;
      background: rgba(0,0,0,0.45);
      border-right: 2px solid #334466;
    }
    .monsters-panel {
      flex: 1;
      padding: 14px;
      background: rgba(0,0,0,0.45);
      min-height: 220px;
    }
    .queue-panel {
      width: 220px;
      padding: 14px;
      background: rgba(0,0,0,0.45);
      border-left: 2px solid #334466;
    }
    .queue-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 10px;
      padding: 1px 0;
      color: #aaccff;
    }
    .queue-row .name { color: #ccddff; }
    .queue-row .tic { color: #6688aa; font-size: 9px; }
    .queue-row .queue-marker { color: #ffcc66; font-weight: bold; font-size: 11px; }
    /* PC-63 DW cascading command menu — three-window modal cascade per the
       locked spec (docs/battle-status-ui.md Cascading Window Spec;
       shared/CommandSelection.png). Orange frames/text, blue hand tab, green
       hand cursor. PC-DEC-027: palette provisional (PMVP window options). */
    .dw-root {
      position: relative;
      flex: 1;
      min-height: 236px;
      overflow: visible;
    }
    .dw-window {
      position: absolute;
      top: 0;
      left: 0;
      width: 290px;
      background: #000;
      border: 4px solid #ff8c1a;
      box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.55);
      padding: 10px 8px 8px;
      font-size: 11px;
      line-height: 1.5;
      color: #ff9a3c;
    }
    .dw-tab {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: #000;
      border: 2px solid #3a3a8c;
      color: #8a8aff;
      padding: 1px 14px;
      font-size: 10px;
      letter-spacing: 1px;
      white-space: nowrap;
      z-index: 2;
    }
    .dw-text {
      margin-bottom: 8px;
      color: #ff9a3c;
      white-space: nowrap;
    }
    .dw-row {
      position: relative;
      padding: 1px 2px 1px 16px;
      cursor: pointer;
      white-space: nowrap;
    }
    .dw-row.active::before {
      content: '\261e';
      position: absolute;
      left: 0;
      top: 0;
      color: #33cc66;
      text-shadow: 0 0 1px #fff, 0 0 1px #fff;
    }
    .dw-row:hover { background: rgba(255, 140, 26, 0.12); }
    .dw-row.disabled { color: #556677; cursor: default; }
    .dw-row.disabled:hover { background: transparent; }
    .dw-gap { height: 8px; }
    .dw-letter { color: #ff9a3c; font-weight: bold; }
    .dw-weapon { color: #8a8aff; }
    .dw-dim { color: #556677; }
    .st-green { color: #33cc66; }
    .st-amber { color: #ffcc66; }
    .st-orange { color: #ff9a3c; }
    .st-red { color: #ff4444; }
    .panel-title {
      color: #88aaff;
      font-size: 11px;
      letter-spacing: 1px;
      margin-bottom: 10px;
      padding-bottom: 4px;
      border-bottom: 1px solid #334466;
    }
    .stat-block {
      background: #000;
      border: 1px solid #ccc;
      padding: 4px 8px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .loadout-mini {
      font-size: 10px;
      color: #a8c8ea;
      margin-top: 8px;
    }
    .message-box {
      background: #0a1a2e;
      border: 3px solid #4a90d9;
      padding: 12px 14px;
      font-size: 12px;
      color: #e0e0ff;
      height: 140px;
      overflow-y: auto;
      line-height: 1.45;
    }
    .msg-line { margin-bottom: 3px; }
    .msg-error {
      background: #2e0a0a;
      border: 2px solid #ff6666;
      padding: 10px 14px;
      font-size: 12px;
      color: #ff9999;
      margin: 4px 0;
    }
    .action-menu {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: rgba(10,26,46,0.78);
      border-top: 2px solid #334466;
    }
    .action-btn {
      flex: 1;
      background: #1a3a1a;
      color: #66ff99;
      border: 3px solid #66ff99;
      padding: 10px 0;
      font-family: 'Pixeloid Mono', 'Courier New', monospace;
      font-size: 13px;
      cursor: pointer;
      letter-spacing: 1px;
    }
    .action-btn:hover {
      background: #2a5a2a;
    }
    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .action-choices {
      display: flex;
      flex: 1;
      gap: 8px;
      min-width: 0;
    }
    .action-choices .action-btn {
      flex: 1;
    }
    .hand-label {
      color: #ffcc66;
    }
    .action-dmg {
      color: #88aaff;
    }
    /* gui1-style per-hand command lists (scoped to action area) */
    .command-box {
      flex: 1;
      background: #0a1a2e;
      padding: 8px 10px;
      border-right: 2px solid #334466;
      min-width: 0;
    }
    .command-box:last-child {
      border-right: none;
    }
    .hand-header {
      color: #ffaa66;
      font-size: 10px;
      margin-bottom: 2px;
      letter-spacing: 0.5px;
    }
    .weapon-name {
      color: #88ccff;
      font-size: 10px;
      margin-bottom: 6px;
      padding-bottom: 3px;
      border-bottom: 1px solid #334466;
    }
    .command-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 12px;
    }
    .command {
      padding: 2px 6px;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .command:hover {
      background: #1a3a6e;
      color: #ffcc66;
    }
    .command.selected {
      color: #ffcc66;
      background: #1a3a6e;
    }
    .slot-btn {
      flex: 0 0 110px;
      width: 110px;
      background: #1a3a1a;
      color: #66ff99;
      border: 3px solid #66ff99;
      padding: 10px 0;
      font-family: 'Pixeloid Mono', 'Courier New', monospace;
      font-size: 13px;
      cursor: pointer;
      letter-spacing: 1px;
      text-align: center;
    }
    .slot-btn:hover:not(:disabled) {
      background: #2a5a2a;
    }
    .slot-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      color: #668866;
      border-color: #446644;
    }
    /* CONFIRM — commit the selected attack; amber to stand out from slots */
    .confirm-btn {
      flex: 0 0 140px;
      width: 140px;
      color: #ffcc66;
      border-color: #ffcc66;
      background: #3a2a1a;
    }
    .confirm-btn:hover:not(:disabled) {
      background: #5a3a1a;
    }
    .confirm-btn:disabled {
      color: #886666;
      border-color: #664444;
    }
    .footer-info {
      background: rgba(10,26,46,0.92);
      border-top: 2px solid #334466;
      padding: 6px 14px;
      font-size: 11px;
      color: #88aaff;
      min-height: 22px;
      display: flex;
      align-items: center;
    }
    .action-status {
      flex: 1;
      text-align: center;
      color: #ffcc66;
      font-size: 11px;
      padding: 10px 0;
      letter-spacing: 1px;
      align-self: center;
    }
    .bottom-bar {
      border-top: 4px solid #4a90d9;
      background: rgba(10,26,46,0.78);
      padding: 10px;
      text-align: center;
      font-size: 10px;
      color: #7a8ca6;
    }
    .monster-card {
      display: inline-block;
      width: 140px;
      margin: 4px;
      vertical-align: top;
    }

    /* AP & Gold bottom dock (PC-52) — placeholder values, backend hookup later */
    .status-dock { position:fixed; bottom:0; left:0; right:0; height:30px; background:rgba(10,26,46,0.7); border-top:2px solid #4a90d9; display:flex; align-items:center; justify-content:space-between; padding:0 16px; font-size:11px; z-index:100; font-family:'Pixeloid Mono','Courier New',monospace; }
    .dock-left { color:#ffcc66; }
    .dock-center { color:#66ccff; display:flex; align-items:center; gap:6px; }
    .dock-right { color:#ffcc66; }
    .ap-meter-small { width:80px; height:3px; background:rgba(0,0,0,0.5); border:1px solid #334466; position:relative; display:inline-block; }
    .ap-fill-small { position:absolute; left:0; top:0; bottom:0; width:80%; background:#66ccff; }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="container">
    <!-- TOP BAR -->
    <div class="top-bar">
      <div class="run-info">
        <h1 id="run-title">PORTAL · RUN —</h1>
        <div class="subtitle" id="battle-label">BATTLE — OF —</div>
        <div class="breadcrumb">PORTALS → BATTLE</div>
      </div>
      <div class="end-run-wrap" style="margin-left:auto; display:flex; align-items:center;">
        <button id="end-run-btn" class="action-btn" style="font-size:10px; padding:4px 8px;">End Run</button>
      </div>
      <div class="dice-panel">
        <div class="dice-header">
          <span>PORTAL DICE</span>
        </div>
        <div class="dice-tray">
          <div>
            <div id="dice-tray"></div>
            <div id="dice-labels" class="dice-labels"></div>
          </div>
          <div id="current-die" class="current-die"></div>
        </div>
      </div>
    </div>

    <!-- MAIN AREA -->
    <div class="main-area">
      <!-- PLAYER -->
      <div class="player-panel">
        <div class="panel-title">PLAYER</div>
        <div class="stat-block" id="player-hp">HP: <span style="color:#66ff99;">Healthy</span></div>
        <div class="loadout-mini">
          LH: <span id="loadout-lh">—</span><br>
          RH: <span id="loadout-rh">—</span>
        </div>
      </div>

      <!-- MONSTERS -->
      <div class="monsters-panel">
        <div class="panel-title">MONSTERS</div>
        <div id="monsters"></div>
      </div>

      <!-- TIME MENU (next-up events queue, per design mockups) -->
      <div class="queue-panel">
        <div class="panel-title">TIME MENU</div>
        <div id="queue"></div>
      </div>
    </div>

    <!-- MESSAGE BOX -->
    <div style="padding:0 14px 8px 14px;">
      <div class="panel-title" style="margin:0 0 6px;">MESSAGE LOG</div>
      <div id="message-box" class="message-box"></div>
    </div>

    <!-- ACTION MENU -->
    <div class="action-menu">
      <div id="action-choices" class="action-choices"></div>
    </div>
    <!-- FOOTER INFO BAR (hover/selection readout) -->
    <div id="footer-info" class="footer-info">Select an attack to see details</div>

    <!-- BOTTOM -->
    <div class="bottom-bar">
      Live combat wired • hp_word only • busy gated • reload restores
    </div>
  </div>

  <script type="module" src="/js/battle-app.js"></script>

<div id="status-dock" class="status-dock" title="AP: +10/day · cap 30 · spent on runs &amp; shop rerolls&#10;Gold: earned from runs · spent at shops, entry fees &amp; rerolls">
  <div class="dock-left" id="hud-name">PLAYER</div>
  <div class="dock-center">
    AP
    <span class="ap-meter-small"><span class="ap-fill-small"></span></span>
    24/30
  </div>
  <div class="dock-right">◉ 1,240gc</div>
</div>
</body>
</html>
