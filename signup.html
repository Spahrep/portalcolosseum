<!DOCTYPE html>
<!--
  Portal Colosseum - Signup Page
  ==============================
  Account creation page with username selection.
  Integrates with Supabase Auth (email/password) and stores username in profiles table.

  Auth Flow:
  1. User enters email, username, and password
  2. Supabase creates auth.users entry via signUp()
  3. Database trigger auto-creates profiles row with username
  4. On success, redirect to game page

  Password policy: 8+ characters.
  No mandatory character classes — see /passwords for guidance.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Colosseum - Signup</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="128x128">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/public/auth.css">
  <!-- Environment configuration - loaded before application scripts -->
  <script src="/api/env.js"></script>

  <style>
    /* Full-screen background image using CSS instead of an img tag */
    body {
      margin: 0;
      padding: 20px 0;
      min-height: 100vh;
      background-image: url('/public/logo.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: 'Courier New', monospace;
      overflow-x: hidden;
    }
  </style>
</head>
<body>
  <div class="auth-overlay"></div>

  <div class="auth-container">
    <h2>CREATE ACCOUNT</h2>

    <!-- Alpha invite key input (required before showing auth providers) -->
    <div id="invite-section">
      <div class="form-group">
        <input type="text" id="invite-key" placeholder="Enter your invite key" required maxlength="64" autocomplete="one-time-code">
      </div>
      <button id="invite-verify-btn" class="btn-primary">Verify Invite Key</button>
      <p class="hint" id="invite-hint">An alpha invite key is required to create an account.</p>
    </div>

    <!-- Auth providers (hidden until valid invite key) -->
    <div id="auth-providers" style="display: none;">
      <!-- OAuth providers: Google and GitHub one-click sign-in -->
      <div class="oauth-buttons">
        <button class="oauth-btn" id="google-signup-btn">
        <!-- Official Google "G" logo -->
        <img src="/public/google-icon.png" alt="Google" class="oauth-icon-img">
        Sign up with Google
      </button>
      <button class="oauth-btn" id="github-signup-btn">
        <!-- GitHub logo -->
        <svg class="oauth-icon" viewBox="0 0 24 24" width="20" height="20" fill="#fff" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.44 9.81 8.21 11.4.6.1.82-.26.82-.57 0-.28-.01-1.12-.02-2-3.34.73-4.04-1.61-4.04-1.61C4.42 21.06 3.63 20.7 3.63 20.7c-1.13-.77.08-.76.08-.76 1.27.09 1.93 1.31 1.93 1.31 1.11 1.93 2.93 1.37 3.65 1.04.11-.81.43-1.37.78-1.68-2.66-.31-5.47-1.33-5.47-5.97 0-1.31.46-2.38 1.23-3.22-.12-.31-.54-1.55.11-3.23 0 0 1.01-.32 3.32 1.23.96-.27 1.99-.41 3.02-.41 1.02 0 2.06.14 3.02.41 2.31-1.55 3.32-1.23 3.32-1.23.66 1.68.24 2.92.12 3.23.77.84 1.23 1.91 1.23 3.22 0 4.65-3.82 5.65-5.98 5.96.44.38.82 1.13.82 2.27 0 1.63-.01 2.95-.01 3.36 0 .31.22.68.83.56C20.56 21.79 24 17.29 24 12 24 5.37 18.63 0 12 0z"/>
        </svg>
        Sign up with GitHub
      </button>
    </div>

    <!-- Divider between OAuth and email methods -->
    <div class="divider">— or —</div>

    <!-- Email/password signup form -->
    <div id="signup-section">
      <div class="form-group">
        <input type="text" id="username" placeholder="Choose a username" required maxlength="32">
      </div>
      <div class="form-group">
        <input type="email" id="email" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <input type="password" id="password" placeholder="Create a password" required minlength="8">
      </div>
      <p class="hint">
        Your password is your account — secure it your way.
        <a href="/passwords" class="text-orange">Password guidance</a>
      </p>
      <button id="email-signup-btn" class="btn-primary">Create Account</button>
      <p class="small-hint">
        Minimum 8 characters. No character class requirements.
      </p>
    </div>
    </div>

    <!-- Already have an account link -->
    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #ccc;">
      Already have an account? <a href="/login" class="text-orange">Log in</a>
    </div>

    <!-- Auth message display area -->
    <div id="auth-message" class="auth-message" style="display: none;"></div>
  </div>

  <!-- Application logic — external ES module (deferred, CSP-compliant) -->
  <script type="module" src="/signup-app.js"></script>
</body>
</html>
