<!DOCTYPE html>
<!--
  Portal Colosseum - Signup Page
  ==============================
  Account creation page with username selection.
  Integrates with Supabase Auth (email/password) and stores username in profiles table.

  Auth Flow:
  1. User enters email, username, and password
  2. Supabase creates auth.users entry via signUp()
  3. Database trigger auto-creates profiles row with username
  4. On success, redirect to game page
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Colosseum - Signup</title>
  <link rel="stylesheet" href="/style.css">
  <!-- Supabase JS Client (ES Module) -->
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    window.supabase = { createClient: createClient };
  </script>

  <!-- Environment configuration - loaded before application scripts -->
  <script src="/api/env.js"></script>
</head>
<body>
  <div class="login-overlay"></div>

  <div class="auth-container">
    <h2 style="text-align: center; margin-bottom: 1.5rem; color: #ff6b3b;">CREATE ACCOUNT</h2>

    <!-- OAuth providers -->
    <div class="oauth-buttons">
      <button class="oauth-btn" onclick="signInWithProvider('google')">
        <span>🔵</span> Sign up with Google
      </button>
      <button class="oauth-btn" onclick="signInWithProvider('github')">
        <span>🐙</span> Sign up with GitHub
      </button>
    </div>

    <div style="text-align: center; color: #666; margin: 1rem 0;">— or —</div>

    <!-- Email/password signup form -->
    <div id="signup-section">
      <div class="form-group">
        <input type="text" id="username" placeholder="Choose a username" required maxlength="32">
      </div>
      <div class="form-group">
        <input type="email" id="email" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <input type="password" id="password" placeholder="Create a password" required minlength="6">
      </div>
      <button onclick="signUpWithEmail()" style="width: 100%; padding: 14px; background: #ff6b3b; color: white; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer;">
        Create Account
      </button>
    </div>

    <div style="text-align: center; color: #666; margin: 1rem 0;">— or —</div>
    <div style="text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #ccc;">
      Already have an account? <a href="/login" style="color: #ff6b3b; text-decoration: none;">Log in</a>
    </div>

    <div id="auth-message" class="auth-message" style="display: none;"></div>
  </div>

  <script>
    // === SUPABASE CONFIGURATION ===
    // Config is loaded from /api/env.js (served by Vercel serverless function)
    const SUPABASE_URL = window.ENV.SUPABASE_URL;
    const SUPABASE_ANON_KEY = window.ENV.SUPABASE_ANON_KEY;
    let supabase;

    function initSupabase() {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      console.log('Supabase initialized:', supabase ? 'OK' : 'FAILED');
    }

    function showMessage(text, type = 'success') {
      const msgEl = document.getElementById('auth-message');
      msgEl.textContent = text;
      msgEl.className = `auth-message ${type}`;
      msgEl.style.display = 'block';
      if (type === 'success') {
        setTimeout(() => { msgEl.style.display = 'none'; }, 4000);
      }
    }

    async function signInWithProvider(provider) {
      if (!supabase) return showMessage('Authentication service not available. Please refresh.', 'error');
      try {
        const { error } = await supabase.auth.signInWithOAuth({
          provider: provider,
          options: { redirectTo: window.location.origin + '/signup' }
        });
        if (error) return showMessage(`${provider} login failed: ${error.message}`, 'error');
      } catch (err) {
        showMessage(`${provider} error: ${err.message}`, 'error');
      }
    }

    async function signUpWithEmail() {
      if (!supabase) return showMessage('Authentication service not available. Please refresh.', 'error');

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !email || !password) {
        return showMessage('Please fill in all fields', 'error');
      }

      if (password.length < 6) {
        return showMessage('Password must be at least 6 characters', 'error');
      }

      // Check username availability before signup
      try {
        const { data: existing, error: checkError } = await supabase
          .from('profiles')
          .select('username')
          .eq('username', username)
          .single();

        if (checkError && checkError.code !== 'PGRST116') {
          console.error('Username check error:', checkError);
        }

        if (existing) {
          return showMessage('Username already taken. Try another.', 'error');
        }
      } catch (err) {
        // PGRST116 means no rows found (username is available)
      }

      // Store username in localStorage for profile creation after auth
      localStorage.setItem('pendingUsername', username);

      // Create auth user via Supabase
      const { error } = await supabase.auth.signUp({
        email: email,
        password: password,
        options: {
          emailRedirectTo: window.location.origin + '/signup-callback'
        }
      });

      if (error) {
        console.error('Signup error:', error);
        showMessage(`Account creation failed: ${error.message}`, 'error');
      } else {
        showMessage('Account created! Check your email to verify and complete signup.', 'success');
      }
    }

    window.onload = function() {
      initSupabase();
      // Handle OAuth callback that returns with username
      if (window.location.hash.includes('access_token')) {
        handleAuthCallback();
      }
    };

    async function handleAuthCallback() {
      const { data: { session }, error } = await supabase.auth.getSessionFromUrl({
        storeSession: true
      });

      if (session) {
        localStorage.setItem('playerName', session.user.email);
        localStorage.setItem('supabaseSession', JSON.stringify(session));
        window.location.href = '/game';
      } else if (error) {
        console.error('Auth callback error:', error);
      }
    }
  </script>
</body>
</html>
