<!DOCTYPE html>
<!--
  Portal Colosseum - Signup Page
  ==============================
  Account creation page with username selection.
  Integrates with Supabase Auth (email/password) and stores username in profiles table.

  Auth Flow:
  1. User enters email, username, and password
  2. Supabase creates auth.users entry via signUp()
  3. Database trigger auto-creates profiles row with username
  4. On success, redirect to game page
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Colosseum - Signup</title>
  <link rel="stylesheet" href="/style.css">
  <!-- Environment configuration - loaded before application scripts -->
  <!-- /api/env.js is a synchronous external script (allowed by CSP script-src 'self') -->
  <!-- that populates window.ENV before the deferred module below executes. -->
  <script src="/api/env.js"></script>
</head>
<body>
  <div class="login-overlay"></div>

  <div class="auth-container">
    <h2 style="text-align: center; margin-bottom: 1.5rem; color: #ff6b3b;">CREATE ACCOUNT</h2>

    <!-- OAuth providers -->
    <div class="oauth-buttons">
      <button class="oauth-btn" id="google-signup-btn">
        <span>🔵</span> Sign up with Google
      </button>
      <button class="oauth-btn" id="github-signup-btn">
        <span>🐙</span> Sign up with GitHub
      </button>
    </div>

    <div style="text-align: center; color: #666; margin: 1rem 0;">— or —</div>

    <!-- Email/password signup form -->
    <div id="signup-section">
      <div class="form-group">
        <input type="text" id="username" placeholder="Choose a username" required maxlength="32">
      </div>
      <div class="form-group">
        <input type="email" id="email" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <input type="password" id="password" placeholder="Create a password" required minlength="6">
      </div>
      <button id="email-signup-btn" style="width: 100%; padding: 14px; background: #ff6b3b; color: white; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer;">
        Create Account
      </button>
    </div>

    <div style="text-align: center; color: #666; margin: 1rem 0;">— or —</div>
    <div style="text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #ccc;">
      Already have an account? <a href="/login" style="color: #ff6b3b; text-decoration: none;">Log in</a>
    </div>

    <div id="auth-message" class="auth-message" style="display: none;"></div>
  </div>

  <!-- Application logic — external ES module (deferred, CSP-compliant) -->
  <!-- Replaces inline scripts that were blocked by CSP script-src without 'unsafe-inline' -->
  <script type="module" src="/signup-app.js"></script>
</body>
</html>
