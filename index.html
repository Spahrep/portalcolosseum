<!DOCTYPE html>
<!--
  Portal Colosseum - Landing Page
  ===============================
  First page users see when visiting the site. Shows the Portal Colosseum
  artwork with a "COMING SOON!" call-to-action button.

  Navigation Flow:
  1. User visits https://portalcolosseum.com/ (this page)
  2. User clicks "ENTER REALM" or "COMING SOON!" button
  3. Redirect to /login for authentication
  4. After login, redirected to /game

  Note: The ENTER REALM button is currently commented out since the game
  isn't ready yet. Users should go to /login directly.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Colosseum</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Landing section with background art -->
  <div id="landing">
    <!-- Fullscreen artwork displayed prominently -->
    <img src="/public/fullscreen.jpg" alt="Portal Colosseum Arena" class="logo">
    <!-- Call-to-action button (currently shows "COMING SOON!") -->
    <a href="/login" class="enter-button">ENTER REALM</a>
  </div>
</body>
</html>
