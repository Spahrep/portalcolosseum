<!DOCTYPE html>
<!--
  Portal Colosseum - Landing Page
  ===============================
  First page users see when visiting the site. Shows the Portal Colosseum
  artwork with an alpha invite notice.

  Navigation Flow:
  1. User visits https://portalcolosseum.com/ (this page)
  2. LOGIN → goes to /login (for existing users)
  3. REGISTER → opens invite key modal → validates → redirects to /signup
  4. After signup, redirected to /game

  Signup is invite-only: users must enter a valid key at the landing page
  before they can create an account.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Colosseum</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="128x128">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Landing section with background art -->
  <div id="landing">
    <!-- Fullscreen artwork displayed prominently -->
    <img src="/public/fullscreen.jpg" alt="Portal Colosseum Arena" class="logo">
    <!-- Alpha invite message -->
    <div class="auth-overlay"></div>
    <div class="alpha-message">
      <p>Currently in development. If you have an invite to be an Alpha Tester, please click below to create an account.</p>
      <!-- Login and Register buttons -->
      <div class="landing-buttons">
        <a href="/login" class="enter-button secondary">LOGIN</a>
        <button id="register-btn" class="enter-button">REGISTER</button>
      </div>
    </div>

    <!-- Invite key modal (hidden by default, shown when Register is clicked) -->
    <div id="invite-modal" class="modal-overlay">
      <div class="modal">
        <h3>Enter Invite Key</h3>
        <input type="text" id="invite-key-input" placeholder="Enter your invite key" maxlength="64" autocomplete="one-time-code">
        <button id="invite-submit" class="btn-primary">Continue</button>
        <button id="invite-cancel" class="btn-secondary">Cancel</button>
        <p class="hint" id="invite-error" style="color: #ff6b35; display: none;"></p>
      </div>
    </div>
  </div>

  <!-- Landing page application logic (deferred, CSP-compliant) -->
  <script src="/landing-app.js"></script>
</body>
</html>
