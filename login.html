<!DOCTYPE html>
<!--
  Portal Colosseum - Login Page
  ==============================
  This page handles user authentication via Supabase. Users can log in using:
  - Google OAuth (one-click sign-in)
  - GitHub OAuth (one-click sign-in)

  Authentication Flow:
  1. Supabase client initialized on page load
  2. Existing session check - if logged in, redirect to game
  3. User selects auth method (OAuth or email)
  4. Supabase handles authentication and redirects back
  5. Callback handler processes auth result and redirects to game page

  For more details, see SUPABASE_SETUP.md
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Colosseum - Login</title>
  <link rel="stylesheet" href="/style.css">
  <!-- Environment configuration - loaded before module scripts -->
  <script src="/api/env.js"></script>

  <style>
    /*
      LOGIN PAGE STYLES
      =================
      Full-screen background image with semi-transparent auth form overlay.
      The background uses the Portal Colosseum artwork for immersion.
    */

    /* Full-screen background image using CSS instead of an img tag */
    body {
      margin: 0;
      padding: 20px 0;
      min-height: 100vh;
      background-image: url('/public/logo.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: 'Courier New', monospace;
      overflow-x: hidden;
    }

    /* Dark semi-transparent overlay behind the form for readability */
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 22, 55, 0.7);
      z-index: 0;
      backdrop-filter: blur(2px);
    }

    /* Main auth form container with glass-morphism effect */
    .auth-container {
      position: relative;
      z-index: 1;
      max-width: 420px;
      margin: 40px auto;
      padding: 2rem;
      background: rgba(15, 22, 55, 0.85);
      border: 2px solid rgba(255, 107, 59, 0.8);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    /* Auth tabs for switching between methods (currently unused - single form) */
    .auth-tabs {
      display: flex;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #333;
    }
    .auth-tab {
      flex: 1;
      padding: 0.75rem;
      text-align: center;
      cursor: pointer;
      color: #aaa;
      border-bottom: 3px solid transparent;
    }
    .auth-tab.active {
      color: #ff6b3b;
      border-bottom-color: #ff6b3b;
      font-weight: bold;
    }

    /* OAuth provider buttons (Google, GitHub) */
    .oauth-buttons {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .oauth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      background: #2a2a40;
      color: white;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .oauth-btn:hover {
      background: #3a3a50;
      border-color: #ff6b3b;
    }

    /* Form input styling */
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      background: #1a1a2e;
      border: 1px solid #444;
      border-radius: 6px;
      color: white;
      font-size: 1rem;
    }
    .form-group input:focus {
      outline: none;
      border-color: #ff6b3b;
    }

    /* Auth message display (success/error) */
    .auth-message {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
    }
    .success { background: #1a3a1a; color: #4ade80; }
    .error { background: #3a1a1a; color: #f87171; }

    /* Hint text */
    .hint {
      font-size: 0.8rem;
      color: #666;
      text-align: center;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <!-- Dark overlay behind the form -->
  <div class="login-overlay"></div>

  <div id="login-page">
    <!-- Arena Access form container -->
    <div class="auth-container">
      <h2 style="text-align: center; margin-bottom: 1.5rem; color: #ff6b3b;">ARENA ACCESS</h2>

      <!-- OAuth providers: Google and GitHub one-click sign-in -->
      <div class="oauth-buttons">
        <button class="oauth-btn" id="google-login-btn">
          <span>🔵</span> Continue with Google
        </button>
        <button class="oauth-btn" id="github-login-btn">
          <span>🐙</span> Continue with GitHub
        </button>
      </div>

      <!-- Divider between OAuth and email methods -->
      <div style="text-align: center; color: #666; margin: 1rem 0;">— or —</div>

      <!-- Email / Password login section -->
      <div id="email-section">
        <div class="form-group">
          <input type="email" id="email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <input type="password" id="password" placeholder="Your password" required minlength="6">
        </div>
        <button id="email-login-btn" style="width: 100%; padding: 14px; background: #ff6b3b; color: white; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer;">
          Log In
        </button>
        <p class="hint">Forgot password? <a href="#" id="reset-link" style="color: #ff6b3b;">Reset it</a></p>
      <!-- Auth message display area (success/error feedback) -->
      <div id="auth-message" class="auth-message" style="display: none;"></div>

      <!-- SIGNUP SECTION - prominent call to action -->
      <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 2px solid rgba(255, 107, 59, 0.4);">
        <div style="text-align: center;">
          <p style="color: #aaa; font-size: 0.9rem; margin-bottom: 0.5rem; font-weight: bold;">— New to the Colosseum? —</p>
          <a href="/signup" style="display: inline-block; padding: 14px 40px; background: linear-gradient(45deg, #ff6b35, #f79339); color: white; border: 2px solid #ff6b3b; border-radius: 10px; font-size: 1.15rem; text-decoration: none; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);">
            ▶ Create Your Account
          </a>
          <p style="color: #888; font-size: 0.85rem; margin-top: 0.75rem;">
            Email/password • Google • GitHub
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Add some bottom padding to ensure signup section isn't cut off -->
  <style>
    body {
      min-height: auto;
      padding: 20px 0;
    }
    .auth-container {
      margin-bottom: 40px;
    }
  </style>

  <!-- Application logic — external ES module (deferred, CSP-compliant) -->
  <!-- Replaces inline script that was blocked by CSP script-src without 'unsafe-inline' -->
  <script type="module" src="/login-app.js"></script>
</body>
</html>
