<!DOCTYPE html>
<!--
  Portal Colosseum - Login Page
  ==============================
  This page handles user authentication via Supabase. Users can log in using:
  - Google OAuth (one-click sign-in)
  - GitHub OAuth (one-click sign-in)
  - Email magic link (passwordless authentication)

  Authentication Flow:
  1. Supabase client initialized on page load
  2. Existing session check - if logged in, redirect to game
  3. User selects auth method (OAuth or email)
  4. Supabase handles authentication and redirects back
  5. Callback handler processes auth result and redirects to game page

  For more details, see SUPABASE_SETUP.md
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Colosseum - Login</title>
  <link rel="stylesheet" href="/style.css">
  <!--
    Supabase JS Client
    Using ES Module import from esm.sh CDN - modern @supabase/supabase-js
    doesn't ship UMD builds, so we use the ES module version with import.
    This gives us access to createClient() for auth and database operations.
  -->
  <script type="module">
    // Import createClient from Supabase's ES module CDN
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.112.4';
    // Make it globally available as window.supabase.createClient
    // so the inline script below can use it
    window.supabase = { createClient: createClient };
  </script>

  <!-- Environment configuration - loaded before application scripts -->
  <script src="/api/env.js"></script>

  <style>
    /*
      LOGIN PAGE STYLES
      =================
      Full-screen background image with semi-transparent auth form overlay.
      The background uses the Portal Colosseum artwork for immersion.
    */

    /* Full-screen background image using CSS instead of an img tag */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-image: url('/public/logo.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: 'Courier New', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Dark semi-transparent overlay behind the form for readability */
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 22, 55, 0.7);
      z-index: 0;
      backdrop-filter: blur(2px);
    }

    /* Main auth form container with glass-morphism effect */
    .auth-container {
      position: relative;
      z-index: 1;
      max-width: 420px;
      margin: 60px auto;
      padding: 2rem;
      background: rgba(15, 22, 55, 0.85);
      border: 2px solid rgba(255, 107, 59, 0.8);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    /* Auth tabs for switching between methods (currently unused - single form) */
    .auth-tabs {
      display: flex;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #333;
    }
    .auth-tab {
      flex: 1;
      padding: 0.75rem;
      text-align: center;
      cursor: pointer;
      color: #aaa;
      border-bottom: 3px solid transparent;
    }
    .auth-tab.active {
      color: #ff6b3b;
      border-bottom-color: #ff6b3b;
      font-weight: bold;
    }

    /* OAuth provider buttons (Google, GitHub) */
    .oauth-buttons {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .oauth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      background: #2a2a40;
      color: white;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .oauth-btn:hover {
      background: #3a3a50;
      border-color: #ff6b3b;
    }

    /* Form input styling */
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      background: #1a1a2e;
      border: 1px solid #444;
      border-radius: 6px;
      color: white;
      font-size: 1rem;
    }
    .form-group input:focus {
      outline: none;
      border-color: #ff6b3b;
    }

    /* Auth message display (success/error) */
    .auth-message {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
    }
    .success { background: #1a3a1a; color: #4ade80; }
    .error { background: #3a1a1a; color: #f87171; }

    /* Hint text */
    .hint {
      font-size: 0.8rem;
      color: #666;
      text-align: center;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <!-- Dark overlay behind the form -->
  <div class="login-overlay"></div>

  <div id="login-page">
    <!-- Arena Access form container -->
    <div class="auth-container">
      <h2 style="text-align: center; margin-bottom: 1.5rem; color: #ff6b3b;">ARENA ACCESS</h2>

      <!-- OAuth providers: Google and GitHub one-click sign-in -->
      <div class="oauth-buttons">
        <button class="oauth-btn" id="google-login-btn">
          <span>🔵</span> Continue with Google
        </button>
        <button class="oauth-btn" id="github-login-btn">
          <span>🐙</span> Continue with GitHub
        </button>
      </div>

      <!-- Divider between OAuth and email methods -->
      <div style="text-align: center; color: #666; margin: 1rem 0;">— or —</div>

      <!-- Email / Password login section -->
      <div id="email-section">
        <div class="form-group">
          <input type="email" id="email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <input type="password" id="password" placeholder="Your password" required minlength="6">
        </div>
        <button id="email-login-btn" style="width: 100%; padding: 14px; background: #ff6b3b; color: white; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer;">
          Log In
        </button>
        <p class="hint">Forgot password? <a href="#" id="reset-link" style="color: #ff6b3b;">Reset it</a></p>
      </div>

      <div style="text-align: center; color: #666; margin: 1rem 0;">— or send magic link —</div>
      <div style="text-align: center;">
        <button id="magic-link-btn" style="padding: 10px 20px; background: transparent; color: #aaa; border: 1px solid #444; border-radius: 6px; cursor: pointer; font-size: 0.9rem;">
          Send Magic Link
        </button>
      </div>

      <!-- Auth message display area (success/error feedback) -->
      <div id="auth-message" class="auth-message" style="display: none;"></div>
    </div>

    <!-- SIGNUP SECTION - prominent call to action below the login form -->
    <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 2px solid rgba(255, 107, 59, 0.4);">
      <div style="text-align: center;">
        <p style="color: #aaa; font-size: 0.9rem; margin-bottom: 0.5rem; font-weight: bold;">— New to the Colosseum? —</p>
        <a href="/signup" style="display: inline-block; padding: 14px 40px; background: linear-gradient(45deg, #ff6b35, #f79339); color: white; border: 2px solid #ff6b3b; border-radius: 10px; font-size: 1.15rem; text-decoration: none; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);">
          ▶ Create Your Account
        </a>
        <p style="color: #888; font-size: 0.85rem; margin-top: 0.75rem;">
          Email/password • Google • GitHub
        </p>
      </div>
    </div>
  </div>

  <!-- Add some bottom padding to ensure signup section isn't cut off -->
  <style>
    body {
      min-height: auto;
      padding: 20px 0;
    }
    .auth-container {
      margin-bottom: 40px;
    }
  </style>

  <script>
    /*
      SUPABASE AUTHENTICATION SCRIPT
      ==============================
      Handles all user authentication including OAuth (Google/GitHub)
      and email magic link authentication.
    */

    // === SUPABASE CONFIGURATION ===
    // Config is loaded from /api/env.js (served by Vercel serverless function)
    const SUPABASE_URL = window.ENV.SUPABASE_URL;
    const SUPABASE_ANON_KEY = window.ENV.SUPABASE_ANON_KEY;

    // Supabase client instance (initialized in initSupabase())
    let supabase;

    /**
     * Initialize the Supabase client.
     * Creates a Supabase client instance that provides access to auth, database, etc.
     * After initialization, check if user has an existing session.
     *
     * Security: We use an in-memory storage adapter instead of localStorage to
     * prevent refresh tokens from being exposed to XSS attacks. Sessions are
     * only retained for the lifetime of the page (no persistence across reloads).
     */
    function initSupabase() {
      // Create the Supabase client with URL and anon key
      // Security: Use in-memory storage adapter to prevent tokens from being
      // exposed to XSS attacks via localStorage. Sessions are retained only
      // for the lifetime of the page (no persistence across reloads).
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
          flowType: 'pkce',        // Use PKCE flow instead of implicit (tokens in URL)
          detectSessionInUrl: true, // Auto-detect and exchange code on callback
          storage: {
            getItem: () => null,
            setItem: () => {},
            removeItem: () => {}
          }
        }
      });
      console.log('Supabase initialized:', supabase ? 'OK' : 'FAILED');
      // Check if already logged in (e.g., refresh from previous session)
      checkExistingSession();
    }

    /**
     * Check if the user already has an active session.
     * If a session exists, redirect to the game page automatically.
     * This prevents showing the login page to authenticated users.
     */
    async function checkExistingSession() {
      if (!supabase) return;
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
          // User is already logged in - store player name and redirect
          const playerName = session.user.email || session.user.user_metadata?.full_name || 'Gladiator';
          localStorage.setItem('playerName', playerName);
          // Security: Do NOT persist session to localStorage (XSS risk)
          // In-memory client means we can only detect session on initial page load
          window.location.href = '/game';
        }
      } catch (error) {
        console.error('Session check error:', error);
      }
    }

    /**
     * Display an authentication message (success or error) to the user.
     * @param {string} text - The message to display
     * @param {string} type - 'success' or 'error'
     */
    function showMessage(text, type = 'success') {
      const msgEl = document.getElementById('auth-message');
      msgEl.textContent = text;
      msgEl.className = `auth-message ${type}`;
      msgEl.style.display = 'block';

      // Auto-hide success messages after 4 seconds
      if (type === 'success') {
        setTimeout(() => {
          msgEl.style.display = 'none';
        }, 4000);
      }
    }

    /**
     * Sign in using an OAuth provider (Google or GitHub).
     * Redirects to the provider's authentication page, then returns to the game page.
     * @param {string} provider - The OAuth provider: 'google' or 'github'
     */
    async function signInWithProvider(provider) {
      if (!supabase) {
        console.error('Supabase not initialized');
        return showMessage('Authentication service not available. Please refresh the page.', 'error');
      }

      console.log(`Attempting ${provider} OAuth sign-in...`);

      try {
        const { data, error } = await supabase.auth.signInWithOAuth({
          provider: provider,
          options: {
            // Where to redirect after successful OAuth authentication
            redirectTo: window.location.origin + '/game',
          }
        });

        if (error) {
          console.error(`${provider} OAuth error:`, error);
          return showMessage(`${provider} login failed: ${error.message}`, 'error');
        }

        console.log(`${provider} OAuth initiated successfully`);
        // Note: The browser will redirect away from here to the OAuth provider
      } catch (err) {
        console.error(`${provider} OAuth exception:`, err);
        showMessage(`${provider} login error: ${err.message}`, 'error');
      }
    }

    /**
     * Send a magic link to the user's email for passwordless authentication.
     * The user opens their email and clicks the link to sign in.
     */
    async function sendMagicLink() {
      if (!supabase) {
        console.error('Supabase not initialized');
        return showMessage('Authentication service not available. Please refresh the page.', 'error');
      }

      const email = document.getElementById('email').value.trim();
      if (!email) {
        return showMessage('Please enter your email address', 'error');
      }

      console.log('Sending magic link to:', email);

      try {
        const { error } = await supabase.auth.signInWithOtp({
          email: email,
          options: {
            emailRedirectTo: window.location.origin + '/game',
          }
        });

        if (error) {
          console.error('Magic link error:', error);
          showMessage(`Failed to send magic link: ${error.message}`, 'error');
        } else {
          showMessage(`Magic link sent to ${email}! Check your inbox.`, 'success');
        }
      } catch (err) {
        console.error('Magic link exception:', err);
        showMessage(`Error: ${err.message}`, 'error');
      }
    }

    /**
     * Sign in with email and password.
     */
    async function signInWithEmail() {
      if (!supabase) {
        console.error('Supabase not initialized');
        return showMessage('Authentication service not available. Please refresh the page.', 'error');
      }

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        return showMessage('Please enter your email and password', 'error');
      }

      // console.log removed to avoid logging PII (email address)

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) {
          console.error('Login error:', error);
          showMessage(`Login failed: ${error.message}`, 'error');
        } else {
          console.log('Login successful');
          localStorage.setItem('playerName', data.user.email);
          // Security: Do NOT persist session to localStorage (XSS risk)
          window.location.href = '/game';
        }
      } catch (err) {
        console.error('Login exception:', err);
        showMessage(`Error: ${err.message}`, 'error');
      }
    }

    /**
     * Send password reset email.
     */
    async function sendResetEmail() {
      const email = document.getElementById('email').value.trim();
      if (!email) {
        return showMessage('Please enter your email address', 'error');
      }

      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/reset-password',
      });

      if (error) {
        showMessage(`Failed to send reset email: ${error.message}`, 'error');
      } else {
        showMessage(`Reset instructions sent to ${email}!`, 'success');
      }
    }

    /**
     * Handle authentication callbacks (OAuth redirect, magic link click).
     * With PKCE + detectSessionInUrl: true, the Supabase client auto-exchanges
     * the auth code for a session. We just need to check if a session exists.
     */
    async function handleAuthCallback() {
      if (!supabase) return;

      try {
        const { data: { session }, error } = await supabase.auth.getSession();

        if (session) {
          // Persist the refresh token in an HttpOnly cookie via our Edge Function
          if (session.refresh_token) {
            try {
              await fetch('/api/session', {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ refresh_token: session.refresh_token })
              });
            } catch (err) {
              console.error('Failed to persist session cookie:', err);
            }
          }
          // Redirect to the game page
          window.location.href = '/game';
        } else if (error) {
          console.error('Auth callback error:', error);
          showMessage('Login failed: ' + error.message, 'error');
        }
      } catch (err) {
        console.error('Callback exception:', err);
        showMessage('Authentication error: ' + err.message, 'error');
      }
    }

    // --- Event listener bindings (no inline onclick handlers) ---
    document.getElementById('google-login-btn').addEventListener('click', () => signInWithProvider('google'));
    document.getElementById('github-login-btn').addEventListener('click', () => signInWithProvider('github'));
    document.getElementById('email-login-btn').addEventListener('click', signInWithEmail);
    document.getElementById('reset-link').addEventListener('click', (e) => { e.preventDefault(); sendResetEmail(); });
    document.getElementById('magic-link-btn').addEventListener('click', sendMagicLink);

    /**
     * Initialize the page when fully loaded.
     * Sets up Supabase, checks for existing sessions, and handles auth callbacks.
     */
    window.onload = function() {
      // Initialize Supabase client
      initSupabase();

      // Check for OAuth/magic link callback (PKCE: code in URL query params)
      // With detectSessionInUrl: true, the Supabase client auto-exchanges the code
      if (window.location.search.includes('code=')) {
        handleAuthCallback();
      }
    };
  </script>
</body>
</html>
