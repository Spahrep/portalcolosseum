<!DOCTYPE html>
<!--
  Portal Colosseum - Login Page
  =============================
  Authentication via Supabase: Google OAuth, GitHub OAuth, or email/password.
  Signup is now a separate invite-only flow accessed via the landing page's
  Register button. Users who already registered can log in here.
  See docs/setup-environment-variables.md for Supabase config.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Colosseum - Login</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="128x128">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/public/auth.css">
  <!-- Environment configuration - loaded before module scripts -->
  <script src="/api/env.js"></script>

  <style>
    /* Full-screen background image using CSS instead of an img tag */
    body {
      margin: 0;
      padding: 20px 0;
      min-height: 100vh;
      background-image: url('/public/logo.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: 'Courier New', monospace;
      overflow-x: hidden;
    }
  </style>
</head>
<body>
  <!-- Dark overlay behind the form -->
  <div class="auth-overlay"></div>

  <div id="login-page">
    <!-- Arena Access form container -->
    <div class="auth-container">
      <h2>ARENA ACCESS</h2>

      <!-- OAuth providers: Google and GitHub one-click sign-in -->
      <div class="oauth-buttons">
        <button class="oauth-btn" id="google-login-btn">
        <!-- Official Google "G" logo -->
        <img src="/public/google-icon.png" alt="Google" class="oauth-icon-img">
        Continue with Google
        </button>
        <button class="oauth-btn" id="github-login-btn">
          <svg class="oauth-icon" viewBox="0 0 24 24" width="20" height="20" fill="#fff" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.44 9.81 8.21 11.4.6.1.82-.26.82-.57 0-.28-.01-1.12-.02-2-3.34.73-4.04-1.61-4.04-1.61C4.42 21.06 3.63 20.7 3.63 20.7c-1.13-.77.08-.76.08-.76 1.27.09 1.93 1.31 1.93 1.31 1.11 1.93 2.93 1.37 3.65 1.04.11-.81.43-1.37.78-1.68-2.66-.31-5.47-1.33-5.47-5.97 0-1.31.46-2.38 1.23-3.22-.12-.31-.54-1.55.11-3.23 0 0 1.01-.32 3.32 1.23.96-.27 1.99-.41 3.02-.41 1.02 0 2.06.14 3.02.41 2.31-1.55 3.32-1.23 3.32-1.23.66 1.68.24 2.92.12 3.23.77.84 1.23 1.91 1.23 3.22 0 4.65-3.82 5.65-5.98 5.96.44.38.82 1.13.82 2.27 0 1.63-.01 2.95-.01 3.36 0 .31.22.68.83.56C20.56 21.79 24 17.29 24 12 24 5.37 18.63 0 12 0z"/>
          </svg>
          Continue with GitHub
        </button>
      </div>

      <!-- Divider between OAuth and email methods -->
      <div class="divider">— or —</div>

      <!-- Email / Password login section -->
      <div id="email-section">
        <div class="form-group">
          <input type="email" id="email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <input type="password" id="password" placeholder="Your password" required minlength="8">
        </div>
        <button id="email-login-btn" class="btn-primary">
          Log In
        </button>
        <p class="hint">Need to reset your password? <a href="/reset-password" class="text-orange">Reset it here</a></p>

        <!-- Auth message display area (success/error feedback) -->
        <div id="auth-message" class="auth-message" style="display: none;"></div>
      </div>
      </div>
    </div>
  </div>

  <!-- Application logic — external ES module (deferred, CSP-compliant) -->
  <script type="module" src="/login-app.js"></script>
</body>
</html>
